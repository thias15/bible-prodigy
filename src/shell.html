<title>Scrolls of Light</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: full-screen game canvas; lapis-and-gold manuscript panels float over it */
:root{
  --lapis:#1d2b66; --lapis-deep:#0e1534; --lapis-mid:#2b3d8f; --lapis-line:#3a4ea8;
  --gold:#e8b94a; --gold-soft:#f6de98; --vellum:#f6ecd4; --muted:#aab4da;
  --rose:#e2604a; --leaf:#72c46a; --sky:#7cc4ff;
  --f-display:'Uncial Antiqua', 'Papyrus', Georgia, serif;
  --f-body:'Nunito', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme: dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--lapis-deep);color:var(--vellum);font-family:var(--f-body);font-size:16px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold-soft);outline-offset:2px}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:var(--lapis-deep)}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---- buttons ---- */
.btn{background:linear-gradient(var(--lapis-mid),var(--lapis));border:2px solid var(--gold);border-radius:12px;padding:.6em 1.1em;font-weight:800;font-size:1rem;color:var(--vellum);box-shadow:0 3px 0 #0a0f26;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0a0f26}
.btn.gold{background:linear-gradient(#f3cd6a,#d39f2c);color:#2a1d05;border-color:#fff1c2}
.btn.ghost{background:transparent;border-color:var(--lapis-line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:.35em .75em;font-size:.88rem;border-radius:10px}

/* ---- HUD ---- */
#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none;z-index:5}
.hcard{pointer-events:auto;background:rgba(14,21,52,.86);border:2px solid var(--gold);border-radius:14px;padding:8px 12px;min-width:180px;backdrop-filter:blur(4px)}
.pname{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:900}
.pname .lv{font-size:.82rem;color:var(--gold-soft);letter-spacing:.06em;text-transform:uppercase}
.bar{position:relative;height:12px;background:#0a0f26;border-radius:8px;overflow:hidden;margin-top:5px;border:1px solid #33407a}
.bar i{position:absolute;inset:0 auto 0 0;width:50%;transition:width .35s}
.bar.hp i{background:linear-gradient(#f07a62,#c8432f)}
.bar.xp{height:7px}.bar.xp i{background:linear-gradient(#9fe08f,#4fa848)}
.bar span{position:absolute;inset:0;font-size:.62rem;font-weight:900;text-align:center;line-height:12px;color:#fff;text-shadow:0 1px 2px #000}
.coins{display:flex;align-items:center;gap:6px;font-weight:900;margin-top:5px;font-size:.92rem;font-variant-numeric:tabular-nums}
.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4,#e8b94a 55%,#a77818);display:inline-block;box-shadow:0 0 0 1px #6b4d0c}
.hbtns{pointer-events:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
.hbtns .btn{padding:.45em .7em;font-size:.82rem}
#track{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:118px;z-index:4;background:rgba(14,21,52,.78);border-left:3px solid var(--gold);padding:6px 10px;border-radius:0 10px 10px 0;font-size:.84rem;font-weight:700;max-width:min(320px,70vw);pointer-events:none}
#track b{color:var(--gold-soft);display:block;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
#banner{position:absolute;left:50%;top:22%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:6;opacity:0;transition:opacity .8s;width:90%}
#banner.show{opacity:1}
#banner h2{font-family:var(--f-display);font-weight:400;font-size:clamp(1.8rem,6vw,3.2rem);color:var(--gold-soft);text-shadow:0 3px 0 #0e1534,0 0 30px rgba(232,185,74,.6);margin:0;text-wrap:balance}
#banner p{margin:.2em 0 0;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.8rem;text-shadow:0 2px 4px #000}

#act{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:6;font-size:1.05rem;padding:.7em 1.4em}
#dpad{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:150px;height:150px;z-index:6}
#dpad button{position:absolute;width:50px;height:50px;border-radius:12px;background:rgba(14,21,52,.7);border:2px solid rgba(232,185,74,.7);font-size:1.2rem;color:var(--gold-soft);touch-action:none}
#dpad [data-d=up]{left:50px;top:0}#dpad [data-d=down]{left:50px;top:100px}#dpad [data-d=left]{left:0;top:50px}#dpad [data-d=right]{left:100px;top:50px}

/* ---- dialog ---- */
#dialog{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(720px,calc(100% - 24px));z-index:20;display:flex;gap:12px;align-items:stretch;background:var(--lapis-deep);border:3px solid var(--gold);border-radius:16px;padding:12px;box-shadow:0 10px 40px rgba(0,0,0,.6);cursor:pointer}
#dialog canvas{width:84px;height:96px;flex:none;background:radial-gradient(circle at 50% 40%,#2e4290,#141d48);border-radius:10px;border:2px solid var(--lapis-line)}
#dialog .dt{flex:1;min-width:0;display:flex;flex-direction:column}
#dName{font-family:var(--f-display);color:var(--gold-soft);font-size:1.15rem}
#dText{font-size:1.06rem;line-height:1.45;margin-top:4px;flex:1;font-weight:600}
.dnext{align-self:flex-end;color:var(--gold);font-size:.78rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}

/* ---- modal panels ---- */
#modal{position:absolute;inset:0;z-index:30;background:rgba(6,9,24,.6);display:flex;align-items:center;justify-content:center;padding:12px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
.panel{width:min(680px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--lapis-deep);border:3px solid var(--gold);border-radius:18px;box-shadow:0 0 0 6px rgba(29,43,102,.8),0 20px 60px rgba(0,0,0,.6);overflow:hidden}
.panel header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(var(--lapis-mid),var(--lapis));border-bottom:2px solid var(--gold)}
.panel h2{margin:0;font-family:var(--f-display);font-weight:400;color:var(--gold-soft);font-size:1.45rem}
.panel .body{padding:14px 16px;overflow:auto;min-height:0}
.x{background:none;border:2px solid var(--gold);border-radius:50%;width:34px;height:34px;font-weight:900;color:var(--gold-soft);font-size:1rem}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #26336f}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .big{font-size:1.8rem;width:44px;text-align:center;flex:none}
.row h4{margin:0;font-size:1rem}
.row p{margin:2px 0 0;font-size:.86rem;color:var(--muted)}
.price{display:flex;align-items:center;gap:5px;font-weight:900;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:.68rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:#26336f;color:var(--gold-soft)}
.tag.ok{background:#2f5a2a;color:#d8f5c8}
.sect{font-family:var(--f-display);color:var(--gold);font-size:1.05rem;margin:14px 0 4px}
.sect:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.chip{border:2px solid var(--lapis-line);border-radius:12px;padding:10px;background:#141d48}
.chip.on{border-color:var(--gold);background:#1f2b66}
.chip h4{margin:0 0 2px;font-size:.95rem}
.chip p{margin:0;font-size:.8rem;color:var(--muted)}
.verse{font-family:Georgia,serif;font-style:italic;color:var(--vellum);line-height:1.5}
.verse cite{display:block;font-style:normal;font-family:var(--f-body);font-weight:800;color:var(--gold-soft);font-size:.8rem;margin-top:2px}
label.f{display:block;font-weight:800;font-size:.85rem;margin:10px 0 4px;color:var(--gold-soft)}
input[type=text],select,textarea{width:100%;box-sizing:border-box;background:#0a0f26;border:2px solid var(--lapis-line);border-radius:10px;color:var(--vellum);padding:.55em .7em;font:inherit;font-weight:700}
textarea{font-family:ui-monospace,monospace;font-size:.75rem;height:70px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--gold)}
.mixrow{display:grid;grid-template-columns:110px 1fr 28px;gap:10px;align-items:center;font-weight:800;font-size:.9rem}
.stat{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;font-size:.9rem;font-variant-numeric:tabular-nums}

/* ---- title / creation ---- */
#title{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));overflow:auto}
#title h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2.6rem,10vw,5.6rem);line-height:.95;margin:0;color:var(--gold-soft);text-shadow:0 4px 0 #0e1534,0 0 40px rgba(232,185,74,.55);text-wrap:balance}
#title .kicker{letter-spacing:.3em;text-transform:uppercase;font-weight:900;font-size:.78rem;color:var(--muted);margin-bottom:10px}
#title .sub{font-size:1.1rem;font-weight:700;margin:14px 0 26px;max-width:32ch;text-wrap:balance}
#title .btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#create{width:min(760px,100%);display:grid;grid-template-columns:200px 1fr;gap:18px;text-align:left;background:var(--lapis-deep);border:3px solid var(--gold);border-radius:18px;padding:18px}
#create h2{grid-column:1/-1;margin:0;font-family:var(--f-display);font-weight:400;color:var(--gold-soft)}
#cPrev{width:200px;height:240px;background:radial-gradient(circle at 50% 45%,#2e4290,#141d48);border-radius:14px;border:2px solid var(--lapis-line)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 2px #33407a}
.sw button.on{border-color:var(--gold-soft);box-shadow:0 0 0 2px var(--gold)}
.sw.txt button{width:auto;border-radius:10px;padding:0 10px;background:#141d48;font-weight:800;font-size:.85rem;height:34px}
.sw.txt button.on{background:#2b3d8f}
@media (max-width:620px){#create{grid-template-columns:1fr}#cPrev{margin:0 auto}}

/* ---- battle ---- */
#battle{position:absolute;inset:0;z-index:25;display:flex;flex-direction:column;background:linear-gradient(var(--bsky,#9fd8ff) 0%,var(--bsky,#9fd8ff) 45%,var(--bground,#6dbf57) 45%,var(--bground2,#5aa848) 100%)}
#arena{position:relative;flex:1;display:flex;align-items:center;justify-content:space-between;padding:60px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));min-height:0}
#arena .side{display:flex;align-items:flex-end;gap:6px;position:relative}
#arena .right{flex-wrap:wrap;justify-content:flex-end;gap:2px;max-width:62%}
.unit{position:relative;display:flex;flex-direction:column;align-items:center;transition:transform .2s}
.unit canvas{display:block}
.unit .uname{font-weight:900;font-size:.82rem;background:rgba(14,21,52,.85);padding:2px 8px;border-radius:999px;margin-top:2px;white-space:nowrap}
.foe{cursor:pointer}
.foe .fh{width:132px;background:rgba(14,21,52,.88);border-radius:10px;padding:4px 6px;border:2px solid transparent}
.foe.target .fh{border-color:var(--gold)}
.foe .fh div{font-size:.72rem;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foe .bar{height:8px;margin-top:3px}
.foe.dead{opacity:0;transform:scale(.4) translateY(30px);pointer-events:none;transition:all .6s}
.compE{font-size:44px;filter:drop-shadow(0 4px 2px rgba(0,0,0,.3));animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.lunge-r{animation:lr .4s}@keyframes lr{50%{transform:translateX(40px)}}
.lunge-l{animation:ll .4s}@keyframes ll{50%{transform:translateX(-40px)}}
.float{position:absolute;font-weight:900;font-size:1.5rem;pointer-events:none;text-shadow:0 2px 0 #000,0 0 8px #000;animation:fl 1.1s forwards;z-index:3;white-space:nowrap}
.float.dmg{color:#ffe28a}.float.heal{color:#9ff59a}.float.hurt{color:#ff8a76}.float.info{color:#cfe3ff;font-size:1.05rem}
@keyframes fl{0%{opacity:0;transform:translateY(0) scale(.7)}15%{opacity:1;transform:translateY(-10px) scale(1.1)}100%{opacity:0;transform:translateY(-60px)}}
.bolt{position:absolute;width:26px;height:26px;border-radius:50%;background:radial-gradient(#fff,#ffe9a0 40%,rgba(232,185,74,0) 70%);box-shadow:0 0 30px 10px rgba(255,226,140,.8);pointer-events:none;z-index:4}
#bpanel{background:var(--lapis-deep);border-top:3px solid var(--gold);padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.bstat{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bstat .bar{flex:1;min-width:140px;height:16px;margin:0}.bstat .bar span{line-height:16px;font-size:.72rem}
.streak{font-weight:900;color:var(--gold-soft);font-size:.85rem}
.shieldtag{font-weight:900;color:var(--sky);font-size:.85rem}
#bSpells{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.spell{text-align:left;padding:.5em .7em;border-radius:12px;border:2px solid var(--gold);background:linear-gradient(var(--lapis-mid),var(--lapis))}
.spell b{display:block;font-size:.92rem}.spell small{display:block;font-size:.7rem;color:var(--muted);font-weight:700;line-height:1.2}
.spell.alt{border-color:var(--lapis-line);background:#141d48}
#bMsg{font-weight:800;min-height:1.3em;font-size:.95rem;color:var(--gold-soft)}
#bWho{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(14,21,52,.85);border:2px solid var(--gold);border-radius:999px;padding:4px 16px;font-family:var(--f-display);color:var(--gold-soft);white-space:nowrap;font-size:1.05rem}

/* ---- question card ---- */
#qcard{position:absolute;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;background:rgba(6,9,24,.55);padding:12px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
.qin{width:min(640px,100%);max-height:100%;overflow:auto;background:var(--vellum);color:#24190c;border-radius:18px;border:4px solid var(--gold);box-shadow:0 0 0 6px var(--lapis),0 20px 60px rgba(0,0,0,.6);padding:18px}
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qcat{font-weight:900;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--lapis);color:var(--gold-soft)}
.say{background:#efe2bf;border:2px solid #c9a95c;border-radius:999px;padding:.3em .8em;font-weight:900;font-size:.8rem;color:#5a4214}
#qText{font-size:clamp(1.15rem,3.6vw,1.5rem);font-weight:800;line-height:1.35;margin:14px 0 16px;text-wrap:balance}
#qText .blank{display:inline-block;min-width:3.5em;border-bottom:3px solid #a77818;color:#a77818}
#qText .vref{display:block;font-size:.85rem;font-weight:800;color:#7a6236;margin-top:6px}
#qText.verseq{font-family:Georgia,serif;font-weight:700}
#qChoices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#qChoices button{background:#fffaf0;border:3px solid #d9c493;border-radius:14px;padding:.8em .7em;font-size:1.05rem;font-weight:800;color:#24190c;text-align:left;display:flex;gap:10px;align-items:center;min-height:56px}
#qChoices button .k{flex:none;width:26px;height:26px;border-radius:50%;background:var(--lapis);color:var(--gold-soft);display:grid;place-items:center;font-size:.8rem}
#qChoices button:hover:not([disabled]){border-color:#a77818}
#qChoices button.right{background:#d8f5c8;border-color:#3f9a3a}
#qChoices button.wrong{background:#ffd9d0;border-color:#c8432f}
#qChoices button[disabled]{cursor:default}
#qFb{margin-top:12px;font-weight:800;font-size:1rem;line-height:1.4;min-height:1.4em}
#qFb.ok{color:#2f7a2a}#qFb.no{color:#a0331f}
#qFb small{display:block;font-weight:700;color:#5a4a30;font-size:.88rem}
#qGo{margin-top:12px;width:100%}
@media (max-width:520px){#qChoices{grid-template-columns:1fr}}

/* ---- profiles & language ---- */
#tLang{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
#tProfiles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:6px 0 18px}
.prof{display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(14,21,52,.85);border:2px solid var(--gold);border-radius:16px;padding:8px 14px 10px;min-width:120px;color:var(--vellum)}
.prof:hover{background:#1f2b66}
.prof canvas{width:60px;height:70px}
.prof b{display:block;font-size:1.05rem}.prof small{display:block;color:var(--muted);font-weight:700;font-size:.75rem}
#tWho{margin:0 0 4px}
.ftag{display:inline-block;font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;background:#26336f;color:var(--gold-soft);border-radius:999px;padding:0 5px;vertical-align:1px}
/* ---- toasts ---- */
#toasts{position:absolute;left:50%;transform:translateX(-50%);top:110px;z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:90%}
.toast{background:var(--lapis-deep);border:2px solid var(--gold);border-radius:12px;padding:8px 16px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.5);animation:tin .3s;text-align:center;max-width:420px}
.toast.big{font-family:var(--f-display);font-weight:400;font-size:1.3rem;color:var(--gold-soft)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
.flash{position:absolute;inset:0;background:#fff;z-index:60;pointer-events:none;animation:flash .5s forwards}
@keyframes flash{from{opacity:.9}to{opacity:0}}
.fragrow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 12px}
.frag{aspect-ratio:3/4;border-radius:8px;border:2px dashed #3a4ea8;display:grid;place-items:center;font-family:var(--f-display);color:#3a4ea8;font-size:1.1rem;max-width:100%}
.frag.got{border:2px solid var(--gold);background:linear-gradient(#f6e6b5,#d9bb72);color:#5a3d08;box-shadow:0 0 14px rgba(232,185,74,.5)}
@media (max-width:600px){.hbtns .btn{font-size:.74rem;padding:.4em .55em}.hcard{min-width:150px;padding:6px 10px}#track{top:104px;font-size:.78rem}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>

<div id="game">
  <canvas id="world"></canvas>

  <div id="hud" hidden>
    <div class="hcard">
      <div class="pname"><span id="hName">Pilgrim</span><span class="lv"><span data-t="hud.level">Level</span> <b id="hLv">1</b></span></div>
      <div class="bar hp"><i id="hHp"></i><span id="hHpT"></span></div>
      <div class="bar xp"><i id="hXp"></i></div>
      <div class="coins"><span class="coin"></span><span id="hCoins">0</span> <span data-t="hud.shekels">shekels</span></div>
    </div>
    <div class="hbtns">
      <button class="btn" id="bQuest" data-t="btn.quests">Quests</button>
      <button class="btn" id="bBag" data-t="btn.bag">Bag</button>
      <button class="btn" id="bMap" data-t="btn.world">World</button>
      <button class="btn" id="bFriends" data-t="btn.friends">Friends</button>
      <button class="btn" id="bSet" aria-label="Settings">⚙</button>
    </div>
  </div>
  <div id="track" hidden></div>
  <div id="banner"><h2 id="bnT"></h2><p id="bnS"></p></div>
  <button class="btn gold" id="act" hidden>Talk</button>
  <div id="dpad" hidden>
    <button data-d="up" aria-label="Up">▲</button><button data-d="left" aria-label="Left">◀</button>
