<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Scrolls of Light – Owner</title>
<style>
:root{--bg:#0e1534;--panel:#141d48;--line:#2b3a7a;--text:#f3ead6;--muted:#a9b0d6;--gold:#e8b94a;--gold2:#f6de98;--green:#7cf08a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font:400 1.4rem Georgia,serif;color:var(--gold2);margin:0}h2{font:400 1.15rem Georgia,serif;color:var(--gold2);margin:22px 0 8px}
main{max-width:1180px;margin:0 auto;padding:8px 16px 40px}
button{font:inherit;font-weight:700;border-radius:10px;border:2px solid var(--gold);background:var(--panel);color:var(--text);padding:7px 14px;cursor:pointer}button.gold{background:var(--gold);color:#1d1406}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}.kpi b{display:block;font-size:1.7rem;color:var(--gold2)}.kpi small{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;overflow-x:auto}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--muted);font-weight:700;cursor:pointer}
td.n,th.n{text-align:right}.live{color:var(--green);font-weight:800}.muted{color:var(--muted)}
.days{display:flex;gap:2px}.days i{width:9px;height:14px;border-radius:2px;background:#26306a}.days i.p1{background:#5a6bc0}.days i.p2{background:#b99a3a}.days i.p3{background:var(--gold2)}
svg text{fill:var(--muted);font-size:10px}
#msg{color:var(--muted)}
@media (max-width:600px){th,td{padding:6px 5px}}
</style>
</head>
<body>
<header><h1>Scrolls of Light · Owner dashboard</h1><div><span id="who" class="muted"></span> <button class="gold" id="signin">Sign in with Google</button> <button id="reload" hidden>Refresh</button></div></header>
<main>
<p id="msg">Sign in with the owner Google account to see who is playing.</p>
<div id="out" hidden>
  <div class="kpis" id="kpis"></div>
  <h2>Activity (last 30 days)</h2><div class="charts"><div class="card" id="chDays"></div><div class="card" id="chHours"></div></div>
  <h2>Players</h2><div class="card"><table id="tbl"></table></div>
  <h2>Families</h2><div class="card"><table id="fam"></table></div>
  <h2>Clean-up</h2><div class="card"><p class="muted">Deletes play-time records older than 12 months, and online data of players not seen for 12 months (their games on their own devices stay).</p><button id="clean">Clean up now</button> <span id="cleanMsg" class="muted"></span></div>
</div>
</main>
<script>/*__CFG__*/</script>
<script>var STR={en:{}};function t(k){return STR.en[k];}
/*__STR__*/</script>
<script>
const $=s=>document.querySelector(s); const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LANG='en', LC={en:{loc:'en-US'}};
/*__NET__*/
const AN=['🐑','🦁','🕊️','🦅','🐫','🐴','🦊','🦌','🐻','🦉','🐟','🐋','🐦','🐐','🐂','🐎','🐇','🐸','🐝','🐜','🐢','🦋','🐔','🐥','🐶','🐱','🦔','🦚','🐏','🐆'];
const WD=['⭐','☀️','🌙','🌈','🌊','🌲','🌿','🎵','👑','🪔','🛡️','⛰️','🔥','☁️','✨','❄️','🍯','🍞','🍇','🌻','🎺','📜','🌹','🌷','🌴','🌾','🌧️','🌱','🔔','💎'];
const nmText=nm=>nm?`${WD[nm[1]]}${AN[nm[0]]} ${STR.en['nm.w'][nm[1]]} ${STR.en['nm.a'][nm[0]]} ${nm[2]}`:'?';
const DAY=86400000, dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const LANGN={en:'English',de:'Deutsch',es:'Español',el:'Ελληνικά'};
let C=null, data=null;
async function signin(){ try{ C=await NET.ctx('admin'); if(!C.u||C.u.anon) await C.google(); show(); load(); }catch(e){ $('#msg').textContent='Sign-in failed: '+(e.code||e.message); } }
function show(){ $('#who').textContent=C&&C.u?(C.u.email||''):''; $('#signin').hidden=!!(C&&C.u&&!C.u.anon); $('#reload').hidden=!$('#signin').hidden; }
async function load(){ $('#msg').textContent='Loading…';
  try{ const [players,fams]=await Promise.all([C.query('players'),C.query('families')]);
    let days=[]; try{ days=await C.group('days'); }catch(e){ for(const p of players){ try{ (await C.query('logs/'+p.id+'/days')).forEach(d=>days.push({id:d.id,path:'logs/'+p.id+'/days/'+d.id,data:d.data})); }catch(e2){} } }
    data={players,fams,days}; render(); $('#msg').textContent=''; $('#out').hidden=false; }
  catch(e){ $('#msg').textContent=(e.code==='permission-denied'||/permission/i.test(e.message))?'This Google account is not the owner account.':'Could not load: '+(e.code||e.message); } }
function render(){ const {players,fams,days}=data; const now=Date.now(); const fam={}; fams.forEach(f=>fam[f.id]=f.data);
  const byP={}; days.forEach(d=>{ const pid=d.path.split('/')[1]; (byP[pid]=byP[pid]||{})[d.id]=d.data; });
  const last30=[...Array(30)].map((_,i)=>dkey(new Date(now-(29-i)*DAY))), last7=last30.slice(-7), last14=last30.slice(-14);
  const active=k=>Object.keys(byP).filter(pid=>byP[pid][k]&&byP[pid][k].sec>30).length;
  const perDay=last30.map(k=>({k,n:active(k),m:Math.round(Object.values(byP).reduce((a,p)=>a+((p[k]&&p[k].sec)||0),0)/60)}));
  const hours=[...Array(24)].map((_,h)=>Math.round(days.filter(d=>last30.includes(d.id)).reduce((a,d)=>a+((d.data.hr&&d.data.hr[h])||0),0)/60));
  const wkMin=pid=>Math.round(last7.reduce((a,k)=>a+((byP[pid]&&byP[pid][k]&&byP[pid][k].sec)||0),0)/60);
  const onNow=players.filter(p=>p.data.on&&now-p.data.on<150000).length;
  const kp=[['Players',players.length],['Families',fams.length],['Played today',active(dkey(new Date()))],['Played this week',Object.keys(byP).filter(pid=>last7.some(k=>byP[pid][k]&&byP[pid][k].sec>30)).length],['Online now',onNow],['Minutes this week',players.reduce((a,p)=>a+wkMin(p.id),0)]];
  $('#kpis').innerHTML=kp.map(([l,v])=>`<div class="kpi"><b>${v}</b><small>${l}</small></div>`).join('');
  $('#chDays').innerHTML=bars(perDay.map(d=>d.n),perDay.map(d=>d.k.slice(5)),'Players per day',5);
  $('#chHours').innerHTML=bars(hours,hours.map((_,h)=>String(h)),'Minutes played by hour of day (player’s local time)',3);
  const rows=players.map(p=>({p,fam:fam[p.data.fid]||{},min:wkMin(p.id),last:Math.max(p.data.on||0,...Object.values(byP[p.id]||{}).map(d=>d.at||0))})).sort((a,b)=>b.last-a.last);
  $('#tbl').innerHTML=`<tr><th>Player</th><th>Family</th><th>Language</th><th class="n">Level</th><th class="n">Worlds</th><th>Last seen</th><th class="n">Min this week</th><th>Last 14 days</th></tr>`+rows.map(r=>{ const d=r.p.data, on=d.on&&now-d.on<150000;
    return `<tr><td>${esc(nmText(d.nm))}</td><td>${esc(r.fam.gname||'Guest family')}</td><td>${esc(LANGN[d.lang]||d.lang||'')}</td><td class="n">${d.lvl||1}</td><td class="n">${d.frags||0}</td><td class="${on?'live':''}">${on?'● online now':r.last?new Date(r.last).toLocaleString():'—'}</td><td class="n">${r.min}</td>
      <td><div class="days">${last14.map(k=>{ const s=(byP[r.p.id]&&byP[r.p.id][k]&&byP[r.p.id][k].sec)||0; return `<i class="${s>1800?'p3':s>600?'p2':s>30?'p1':''}" title="${k}: ${Math.round(s/60)} min"></i>`; }).join('')}</div></td></tr>`; }).join('');
  $('#fam').innerHTML=`<tr><th>Family</th><th class="n">Players</th><th>Created</th></tr>`+fams.map(f=>`<tr><td>${esc(f.data.gname||'Guest family')}</td><td class="n">${players.filter(p=>p.data.fid===f.id).length}</td><td>${f.data.created?new Date(f.data.created).toLocaleDateString():'—'}</td></tr>`).join('');
}
function bars(vals,labels,title,every){ const W=560,H=200,pl=28,pb=22,pt=24,max=Math.max(1,...vals); const bw=(W-pl)/vals.length;
  const ticks=[0,Math.round(max/2),max]; let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(title)}"><text x="0" y="12" style="font-size:12px;fill:#f6de98">${esc(title)}</text>`;
  ticks.forEach(v=>{ const y=H-pb-(H-pb-pt)*v/max; s+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="#2b3a7a"/><text x="${pl-4}" y="${y+3}" text-anchor="end">${v}</text>`; });
  vals.forEach((v,i)=>{ const h=(H-pb-pt)*v/max, x=pl+i*bw+bw*.15; s+=`<rect x="${x}" y="${H-pb-h}" width="${bw*.7}" height="${h}" rx="2" fill="#e8b94a"><title>${esc(labels[i])}: ${v}</title></rect>`; if(i%every===0) s+=`<text x="${x+bw*.35}" y="${H-6}" text-anchor="middle">${esc(labels[i])}</text>`; });
  return s+'</svg>'; }
async function clean(){ if(!data) return; const cut=Date.now()-365*DAY, ck=dkey(new Date(cut)); let n=0;
  for(const d of data.days){ if(d.id<ck){ try{ await C.del(d.path); n++; }catch(e){} } }
  for(const p of data.players){ const last=p.data.on||0; if(last&&last<cut){ for(const path of ['saves/'+p.id,'codes/'+p.data.code,'names/'+(p.data.nm||[]).join('-'),'players/'+p.id]){ try{ await C.del(path); n++; }catch(e){} } } }
  $('#cleanMsg').textContent=`Removed ${n} old records.`; load(); }
$('#signin').onclick=signin; $('#reload').onclick=load; $('#clean').onclick=()=>{ if(confirm('Delete records older than 12 months?')) clean(); };
(async()=>{ try{ C=await NET.ctx('admin'); if(C.u&&!C.u.anon){ show(); load(); } }catch(e){} })();
</script>
</body>
</html>
