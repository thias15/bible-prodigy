<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Scrolls of Light: a Bible adventure game for kids 8-15.">
<title>Scrolls of Light</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d2b66">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Nunito:wght@500;700;800;900&family=Lexend:wght@400;600;700&display=swap">
<style>
/* Layout: full-screen game canvas; lapis-and-gold manuscript panels float over it */
:root{
  --lapis:#1d2b66; --lapis-deep:#0e1534; --lapis-mid:#2b3d8f; --lapis-line:#3a4ea8;
  --gold:#e8b94a; --gold-soft:#f6de98; --vellum:#f6ecd4; --muted:#aab4da;
  --rose:#e2604a; --leaf:#72c46a; --sky:#7cc4ff;
  --f-display:'Uncial Antiqua', 'Papyrus', Georgia, serif;
  --f-body:'Nunito', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme: dark;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--lapis-deep);color:var(--vellum);font-family:var(--f-body);font-size:16px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold-soft);outline-offset:2px}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:var(--lapis-deep)}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---- buttons ---- */
.btn{background:linear-gradient(var(--lapis-mid),var(--lapis));border:2px solid var(--gold);border-radius:12px;padding:.6em 1.1em;font-weight:800;font-size:1rem;color:var(--vellum);box-shadow:0 3px 0 #0a0f26;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0a0f26}
.btn.gold{background:linear-gradient(#f3cd6a,#d39f2c);color:#2a1d05;border-color:#fff1c2}
.btn.ghost{background:transparent;border-color:var(--lapis-line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:.35em .75em;font-size:.88rem;border-radius:10px}

/* ---- HUD ---- */
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:1}
#hud{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none;z-index:5}
.htop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.hcard{pointer-events:auto;background:rgba(14,21,52,.86);border:2px solid var(--gold);border-radius:14px;padding:7px 12px;min-width:0;flex:0 1 220px;backdrop-filter:blur(4px)}
.pname{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:900}
.pname>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pname .lv{font-size:.82rem;color:var(--gold-soft);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.bar{position:relative;height:12px;background:#0a0f26;border-radius:8px;overflow:hidden;margin-top:5px;border:1px solid #33407a}
.bar i{position:absolute;inset:0 auto 0 0;width:50%;transition:width .35s}
.bar.hp i{background:linear-gradient(#f07a62,#c8432f)}
.bar.xp{height:7px}.bar.xp i{background:linear-gradient(#9fe08f,#4fa848)}
.bar span{position:absolute;inset:0;font-size:.62rem;font-weight:900;text-align:center;line-height:12px;color:#fff;text-shadow:0 1px 2px #000}
.coins{display:flex;align-items:center;gap:6px;font-weight:900;margin-top:5px;font-size:.92rem;font-variant-numeric:tabular-nums}
.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4,#e8b94a 55%,#a77818);display:inline-block;box-shadow:0 0 0 1px #6b4d0c;flex:none}
.hbtns{pointer-events:auto;display:flex;gap:6px;flex-wrap:nowrap;justify-content:flex-end}
.hb{display:flex;align-items:center;justify-content:center;gap:7px;height:46px;min-width:46px;padding:0 12px;border-radius:14px;background:rgba(14,21,52,.86);border:2px solid rgba(232,185,74,.6);font-weight:800;font-size:.9rem;color:var(--vellum);backdrop-filter:blur(4px)}
.hb svg{width:22px;height:22px;flex:none}
.hb:active{transform:translateY(1px)}
.hb.view{border-color:var(--gold);background:linear-gradient(#2b3d8f,#1d2b66)}
.hb.view b{font-size:.95rem;color:var(--gold-soft)}
.hb.view,.hbtns .hb.view{padding:0 14px;gap:7px;white-space:nowrap}
@media (max-width:480px){.hbtns .hb.view{padding:0 12px}.hb.view svg{display:none}}
#bMenu{display:none}
@media (max-width:1180px){.hb span{display:none}.hb{padding:0}}
@media (max-width:720px){.hb.more{display:none}#bMenu{display:flex}.hb{height:44px;min-width:44px}.hcard{padding:6px 10px}.bar.xp{display:none}}
@media (max-width:380px){.hb{height:40px;min-width:40px}.hbtns{gap:5px}.hcard .coins{font-size:.82rem}}
#track{align-self:flex-start;background:rgba(14,21,52,.78);border-left:3px solid var(--gold);padding:6px 10px;border-radius:0 10px 10px 0;font-size:.84rem;font-weight:700;max-width:min(320px,70vw);pointer-events:none}
#track b{color:var(--gold-soft);display:block;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
#banner{position:absolute;left:50%;top:22%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:6;opacity:0;transition:opacity .8s;width:90%}
#banner.show{opacity:1}
#banner h2{font-family:var(--f-display);font-weight:400;font-size:clamp(1.8rem,6vw,3.2rem);color:var(--gold-soft);text-shadow:0 3px 0 #0e1534,0 0 30px rgba(232,185,74,.6);margin:0;text-wrap:balance}
#banner p{margin:.2em 0 0;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.8rem;text-shadow:0 2px 4px #000}

#act{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:6;font-size:1.05rem;padding:.7em 1.4em;max-width:80vw}
@media (pointer:coarse){#act{left:auto;transform:none;right:max(16px,env(safe-area-inset-right,0px));min-height:58px;border-radius:29px;max-width:62vw}}
#joy{position:absolute;z-index:6;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid rgba(246,222,152,.7);background:rgba(14,21,52,.25);pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff3c4,#e8b94a);box-shadow:0 3px 10px rgba(0,0,0,.4)}
#hint{position:absolute;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom,0px));background:rgba(14,21,52,.85);border:1px solid var(--lapis-line);border-radius:999px;padding:7px 16px;font-weight:800;font-size:.85rem;color:var(--muted);pointer-events:none;white-space:nowrap;transition:opacity .8s;max-width:90vw;overflow:hidden;text-overflow:ellipsis}

/* ---- badges, challenges, book, battle intents ---- */
.hb.badge{position:relative}.hb.badge::after{content:'';position:absolute;top:5px;right:5px;width:11px;height:11px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 2px #0e1534}
#bMenu.badge{position:relative}
.chrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #26336f}.chrow.done{opacity:.6}.chrow .grow{flex:1;min-width:0}.chrow small{color:var(--muted);font-weight:700}
.card.bk canvas{width:76px;height:76px}.card.unk b{color:var(--muted)}.card.unk canvas{filter:grayscale(1) brightness(.35)}
.fh .intent{margin-right:4px}
.fh .mech{font-size:.7rem;font-weight:900;color:var(--gold-soft);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foe.charging .fh{border-color:#ffb040;box-shadow:0 0 12px rgba(255,176,64,.7)}
#bComp.evo .compE{filter:drop-shadow(0 0 8px rgba(255,220,120,.9)) drop-shadow(0 4px 2px rgba(0,0,0,.3))}
body.big #qText{font-size:clamp(1.35rem,4.4vw,1.85rem)}body.big #qChoices button{font-size:1.25rem}body.big #dText{font-size:1.28rem}body.big .row p,body.big .card small{font-size:.95rem}body.big #track{font-size:.98rem}
body.easyfont #qText,body.easyfont #qChoices button,body.easyfont #dText,body.easyfont #qFb,body.easyfont .row p,body.easyfont #track{font-family:'Lexend','Nunito',sans-serif;letter-spacing:.01em}
body.easyfont #qText.verseq{font-family:'Lexend',Georgia,serif;font-style:normal}

/* ---- house ---- */
#hbar{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(14,21,52,0),rgba(14,21,52,.95) 28%);display:flex;flex-direction:column;gap:6px}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hhead b{font-family:var(--f-display);font-weight:400;color:var(--gold-soft);font-size:1.3rem}
#htools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:44px;align-items:center}
.tb{height:44px;padding:0 16px;border-radius:14px;border:2px solid var(--gold);background:linear-gradient(#2b3d8f,#1d2b66);font-weight:900}
.tb.warn{border-color:#c8432f}
.htip{color:var(--muted);font-weight:800;font-size:.85rem;text-align:center}
.hsel{color:var(--gold-soft);font-weight:900}
#inv{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:thin;overscroll-behavior:contain}
#inv .card{flex:none;width:104px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.card{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 6px 8px;border-radius:14px;border:2px solid var(--lapis-line);background:#141d48;font-weight:800;font-size:.8rem;text-align:center;min-width:0;color:var(--vellum)}
.card img{width:76px;height:76px;object-fit:contain}
.card .emo{font-size:46px;line-height:76px;height:76px}
.card.on{border-color:var(--gold);background:#22307a}
.card .pr{display:flex;align-items:center;gap:4px;color:var(--gold-soft);font-size:.78rem}
.card .own{color:#9fe08f;font-size:.74rem}
.card small{color:var(--muted);font-weight:700;font-size:.72rem;line-height:1.25}
.card[disabled]{opacity:.45;cursor:default}
.wprev{display:flex;justify-content:center;margin:-4px 0 4px}
.wprev img,.wprev canvas{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#3a52b0,#141d48);border:3px solid var(--gold-soft)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{height:38px;padding:0 13px;border-radius:12px;border:2px solid var(--lapis-line);background:#141d48;font-weight:800;font-size:.88rem}
.pills button.on{border-color:var(--gold);background:#2b3d8f}
.mtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.mtile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px;border-radius:14px;border:2px solid var(--lapis-line);background:#141d48;text-align:left}
.mtile svg{width:28px;height:28px;color:var(--gold-soft)}
.mtile b{font-size:1rem}.mtile small{color:var(--muted);font-weight:700;font-size:.78rem}

/* ---- dialog ---- */
#dialog{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(720px,calc(100% - 24px));z-index:20;display:flex;gap:12px;align-items:stretch;background:var(--lapis-deep);border:3px solid var(--gold);border-radius:16px;padding:12px;box-shadow:0 10px 40px rgba(0,0,0,.6);cursor:pointer}
#dialog canvas{width:84px;height:96px;flex:none;background:radial-gradient(circle at 50% 40%,#2e4290,#141d48);border-radius:10px;border:2px solid var(--lapis-line)}
#dialog .dt{flex:1;min-width:0;display:flex;flex-direction:column}
#dName{font-family:var(--f-display);color:var(--gold-soft);font-size:1.15rem}
#dText{font-size:1.06rem;line-height:1.45;margin-top:4px;flex:1;font-weight:600}
.dnext{align-self:flex-end;color:var(--gold);font-size:.78rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}

/* ---- modal panels ---- */
#modal{position:absolute;inset:0;z-index:30;background:rgba(6,9,24,.6);display:flex;align-items:center;justify-content:center;padding:12px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
.panel{width:min(680px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--lapis-deep);border:3px solid var(--gold);border-radius:18px;box-shadow:0 0 0 6px rgba(29,43,102,.8),0 20px 60px rgba(0,0,0,.6);overflow:hidden}
.panel header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(var(--lapis-mid),var(--lapis));border-bottom:2px solid var(--gold)}
.panel h2{margin:0;font-family:var(--f-display);font-weight:400;color:var(--gold-soft);font-size:1.45rem}
.panel .body{padding:14px 16px;overflow:auto;min-height:0}
.x{background:none;border:2px solid var(--gold);border-radius:50%;width:34px;height:34px;font-weight:900;color:var(--gold-soft);font-size:1rem}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #26336f}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .big{font-size:1.8rem;width:44px;text-align:center;flex:none}
.row h4{margin:0;font-size:1rem}
.row p{margin:2px 0 0;font-size:.86rem;color:var(--muted)}
.price{display:flex;align-items:center;gap:5px;font-weight:900;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:.68rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:#26336f;color:var(--gold-soft)}
.tag.ok{background:#2f5a2a;color:#d8f5c8}
.sect{font-family:var(--f-display);color:var(--gold);font-size:1.05rem;margin:14px 0 4px}
.sect:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.chip{border:2px solid var(--lapis-line);border-radius:12px;padding:10px;background:#141d48}
.chip.on{border-color:var(--gold);background:#1f2b66}
.chip h4{margin:0 0 2px;font-size:.95rem}
.chip p{margin:0;font-size:.8rem;color:var(--muted)}
.verse{font-family:Georgia,serif;font-style:italic;color:var(--vellum);line-height:1.5}
.verse cite{display:block;font-style:normal;font-family:var(--f-body);font-weight:800;color:var(--gold-soft);font-size:.8rem;margin-top:2px}
label.f{display:block;font-weight:800;font-size:.85rem;margin:10px 0 4px;color:var(--gold-soft)}
input[type=text],select,textarea{width:100%;box-sizing:border-box;background:#0a0f26;border:2px solid var(--lapis-line);border-radius:10px;color:var(--vellum);padding:.55em .7em;font:inherit;font-weight:700}
textarea{font-family:ui-monospace,monospace;font-size:.75rem;height:70px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--gold)}
.mixrow{display:grid;grid-template-columns:110px 1fr 28px;gap:10px;align-items:center;font-weight:800;font-size:.9rem}
.stat{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;font-size:.9rem;font-variant-numeric:tabular-nums}

/* ---- title / creation ---- */
#title{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));overflow:auto}
#title h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2.6rem,10vw,5.6rem);line-height:.95;margin:0;color:var(--gold-soft);text-shadow:0 4px 0 #0e1534,0 0 40px rgba(232,185,74,.55);text-wrap:balance}
#title .kicker{letter-spacing:.3em;text-transform:uppercase;font-weight:900;font-size:.78rem;color:var(--muted);margin-bottom:10px}
#title .sub{font-size:1.1rem;font-weight:700;margin:14px auto 26px;max-width:32ch;text-wrap:balance}
#title .btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#create{width:min(760px,100%);display:grid;grid-template-columns:200px 1fr;gap:18px;text-align:left;background:var(--lapis-deep);border:3px solid var(--gold);border-radius:18px;padding:18px}
#create h2{grid-column:1/-1;margin:0;font-family:var(--f-display);font-weight:400;color:var(--gold-soft)}
#cPrev{width:200px;height:240px;background:radial-gradient(circle at 50% 45%,#2e4290,#141d48);border-radius:14px;border:2px solid var(--lapis-line)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 2px #33407a}
.sw button.on{border-color:var(--gold-soft);box-shadow:0 0 0 2px var(--gold)}
.sw.txt button{width:auto;border-radius:10px;padding:0 10px;background:#141d48;font-weight:800;font-size:.85rem;height:34px}
.sw.txt button.on{background:#2b3d8f}
@media (max-width:620px){#create{grid-template-columns:1fr}#cPrev{margin:0 auto}}

/* ---- battle ---- */
#battle{position:absolute;inset:0;z-index:25;display:flex;flex-direction:column;background:linear-gradient(var(--bsky,#9fd8ff) 0%,var(--bsky,#9fd8ff) 45%,var(--bground,#6dbf57) 45%,var(--bground2,#5aa848) 100%)}
#arena{position:relative;flex:1;display:flex;align-items:center;justify-content:space-between;padding:60px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));min-height:0}
#arena .side{display:flex;align-items:flex-end;gap:6px;position:relative}
#arena .right{flex-wrap:wrap;justify-content:flex-end;gap:2px;max-width:62%}
.unit{position:relative;display:flex;flex-direction:column;align-items:center;transition:transform .2s}
.unit canvas{display:block}
.unit .uname{font-weight:900;font-size:.82rem;background:rgba(14,21,52,.85);padding:2px 8px;border-radius:999px;margin-top:2px;white-space:nowrap}
.foe{cursor:pointer}
.foe .fh{width:132px;background:rgba(14,21,52,.88);border-radius:10px;padding:4px 6px;border:2px solid transparent}
.bossu .fh{width:min(230px,58vw)}
.foe.target .fh{border-color:var(--gold)}
.foe .fh div{font-size:.72rem;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foe .bar{height:8px;margin-top:3px}
.foe.dead{opacity:0;transform:scale(.4) translateY(30px);pointer-events:none;transition:all .6s}
.compE{font-size:44px;filter:drop-shadow(0 4px 2px rgba(0,0,0,.3));animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.lunge-r{animation:lr .4s}@keyframes lr{50%{transform:translateX(40px)}}
.lunge-l{animation:ll .4s}@keyframes ll{50%{transform:translateX(-40px)}}
.float{position:absolute;font-weight:900;font-size:1.5rem;pointer-events:none;text-shadow:0 2px 0 #000,0 0 8px #000;animation:fl 1.1s forwards;z-index:3;white-space:nowrap}
.float.dmg{color:#ffe28a}.float.heal{color:#9ff59a}.float.hurt{color:#ff8a76}.float.info{color:#cfe3ff;font-size:1.05rem}
@keyframes fl{0%{opacity:0;transform:translateY(0) scale(.7)}15%{opacity:1;transform:translateY(-10px) scale(1.1)}100%{opacity:0;transform:translateY(-60px)}}
.bolt{position:absolute;width:26px;height:26px;border-radius:50%;background:radial-gradient(#fff,#ffe9a0 40%,rgba(232,185,74,0) 70%);box-shadow:0 0 30px 10px rgba(255,226,140,.8);pointer-events:none;z-index:4}
#bpanel{background:var(--lapis-deep);border-top:3px solid var(--gold);padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.bstat{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bstat .bar{flex:1;min-width:140px;height:16px;margin:0}.bstat .bar span{line-height:16px;font-size:.72rem}
.streak{font-weight:900;color:var(--gold-soft);font-size:.85rem}
.shieldtag{font-weight:900;color:var(--sky);font-size:.85rem}
#bSpells{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.spell{text-align:left;padding:.5em .7em;border-radius:12px;border:2px solid var(--gold);background:linear-gradient(var(--lapis-mid),var(--lapis))}
.spell b{display:block;font-size:.92rem}.spell small{display:block;font-size:.7rem;color:var(--muted);font-weight:700;line-height:1.2}
.spell.alt{border-color:var(--lapis-line);background:#141d48}
#bMsg{font-weight:800;min-height:1.3em;font-size:.95rem;color:var(--gold-soft)}
#battle.b3d{background:transparent}
#battle.b3d #arena .side{position:static}
#battle.b3d .unit{position:absolute;left:-999px;top:0;transform:translate(-50%,-100%);transition:none}
#battle.b3d .unit canvas{opacity:0}
#battle.b3d .compE{opacity:0;animation:none;display:block}
#battle.b3d .uname{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:4px}
#battle.b3d .shake,#battle.b3d .lunge-r,#battle.b3d .lunge-l{animation:none}
#battle.b3d .foe.dead{transform:translate(-50%,-100%)}
@media (max-width:560px){#battle.b3d .foe .fh{width:96px;padding:3px 5px}#battle.b3d .foe .fh div{font-size:.62rem}#battle.b3d .bossu .fh{width:min(170px,46vw)}#battle.b3d .ftag{display:none}}
#bWho{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(14,21,52,.85);border:2px solid var(--gold);border-radius:999px;padding:4px 16px;font-family:var(--f-display);color:var(--gold-soft);white-space:nowrap;font-size:1.05rem}

/* ---- question card ---- */
#qcard{position:absolute;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;background:rgba(6,9,24,.55);padding:12px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
.qin{width:min(640px,100%);max-height:100%;overflow:auto;background:var(--vellum);color:#24190c;border-radius:18px;border:4px solid var(--gold);box-shadow:0 0 0 6px var(--lapis),0 20px 60px rgba(0,0,0,.6);padding:18px}
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qcat{font-weight:900;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--lapis);color:var(--gold-soft)}
.qbtns{display:flex;gap:6px}
.say{background:#efe2bf;border:2px solid #c9a95c;border-radius:999px;padding:.3em .8em;font-weight:900;font-size:.8rem;color:#5a4214}
#qText{font-size:clamp(1.15rem,3.6vw,1.5rem);font-weight:800;line-height:1.35;margin:14px 0 16px;text-wrap:balance}
#qText .blank{display:inline-block;min-width:3.5em;border-bottom:3px solid #a77818;color:#a77818}
#qText .vref{display:block;font-size:.85rem;font-weight:800;color:#7a6236;margin-top:6px}
#qText.verseq{font-family:Georgia,serif;font-weight:700}
#qChoices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#qChoices button{background:#fffaf0;border:3px solid #d9c493;border-radius:14px;padding:.8em .7em;font-size:1.05rem;font-weight:800;color:#24190c;text-align:left;display:flex;gap:10px;align-items:center;min-height:56px}
#qChoices button .k{flex:none;width:26px;height:26px;border-radius:50%;background:var(--lapis);color:var(--gold-soft);display:grid;place-items:center;font-size:.8rem}
#qChoices button:hover:not([disabled]){border-color:#a77818}
#qChoices button.right{background:#d8f5c8;border-color:#3f9a3a}
#qChoices button.wrong{background:#ffd9d0;border-color:#c8432f}
#qChoices button[disabled]{cursor:default}
#qFb{margin-top:12px;font-weight:800;font-size:1rem;line-height:1.4;min-height:1.4em}
#qFb.ok{color:#2f7a2a}#qFb.no{color:#a0331f}
#qFb small{display:block;font-weight:700;color:#5a4a30;font-size:.88rem}
#qGo{margin-top:12px;width:100%}
@media (max-width:520px){#qChoices{grid-template-columns:1fr}}

/* ---- profiles & language ---- */
#tLang{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
#tProfiles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:6px 0 18px}
.prof{display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(14,21,52,.85);border:2px solid var(--gold);border-radius:16px;padding:8px 14px 10px;min-width:120px;color:var(--vellum)}
.prof:hover{background:#1f2b66}
.prof canvas{width:60px;height:70px}
.prof b{display:block;font-size:1.05rem}.prof small{display:block;color:var(--muted);font-weight:700;font-size:.75rem}
#tWho{margin:0 0 4px}
.ftag{display:inline-block;font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;background:#26336f;color:var(--gold-soft);border-radius:999px;padding:0 5px;vertical-align:1px}
/* ---- toasts ---- */
#toasts{position:absolute;left:50%;transform:translateX(-50%);top:max(170px,26%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:90%}
.toast{background:var(--lapis-deep);border:2px solid var(--gold);border-radius:12px;padding:8px 16px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.5);animation:tin .3s;text-align:center;max-width:420px}
.toast.big{font-family:var(--f-display);font-weight:400;font-size:1.3rem;color:var(--gold-soft)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
.flash{position:absolute;inset:0;background:#fff;z-index:60;pointer-events:none;animation:flash .5s forwards}
@keyframes flash{from{opacity:.9}to{opacity:0}}
.fragrow{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:6px 0 12px}
.frag{aspect-ratio:3/4;border-radius:8px;border:2px dashed #3a4ea8;display:grid;place-items:center;font-family:var(--f-display);color:#3a4ea8;font-size:1.1rem;max-width:100%}
.frag.got{border:2px solid var(--gold);background:linear-gradient(#f6e6b5,#d9bb72);color:#5a3d08;box-shadow:0 0 14px rgba(232,185,74,.5)}
@media (max-width:600px){#track{font-size:.78rem}}
@media (max-height:480px){#arena{padding-top:34px}#bWho{top:4px;font-size:.85rem;padding:2px 12px}.foe .fh{width:112px;padding:3px 5px}.bossu .fh{width:min(190px,40vw)}#bpanel{padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));gap:4px}#bSpells{grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:5px}.spell{padding:.3em .55em}.spell small{display:none}#bMsg{font-size:.85rem}.qin{padding:12px}#qText{margin:8px 0 10px}#qChoices button{min-height:44px;padding:.5em .6em}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>

</head>

 ARMOR:{belt:{name:'Gürtel der Wahrheit',ref:'Epheser 6,14'},shoes:{name:'Schuhe des Friedens',ref:'Epheser 6,15'},breast:{name:'Brustpanzer der Gerechtigkeit',ref:'Epheser 6,14'},shield:{name:'Schild des Glaubens',ref:'Epheser 6,16'},helmet:{name:'Helm der Rettung',ref:'Epheser 6,17'},sword:{name:'Schwert des Geistes',ref:'Epheser 6,17'}},
 SPELLS:[{name:'Glaubensschlag',desc:'Triff einen Gegner mit Licht.'},{name:'Gebet',desc:'Heilt 35 % deines Lebens.'},{name:'Hoffnungsschild',desc:'Blockt 2 Runden lang fast allen Schaden.'},{name:'Mutstoß',desc:'Ein riesiger Treffer gegen einen Gegner.'},{name:'Welle der Weisheit',desc:'Trifft alle Gegner auf einmal.'}],
 DYES:{purple:{name:'Königspurpur',note:'Lydia handelte mit Purpurstoff (Apostelgeschichte 16,14).'},scarlet:{name:'Scharlachrot',note:'Wie Rahabs rote Schnur (Josua 2,18).'},sky:{name:'Himmelblau',note:'Blau wie der See Genezareth.'},white:{name:'Leuchtend Weiß',note:'Der Engel am Grab trug Weiß (Matthäus 28,3).'},rainbow:{name:'Bunter Mantel',note:'Wie der Mantel von Josef (1. Mose 37,3).'}},
 COMPS:{lamb:{name:'Lamm',desc:'Heilt dich jede Runde ein bisschen.'},dove:{name:'Taube',desc:'Heilt dich jede Runde. Ein Zeichen des Friedens.'},frog:{name:'Frosch',desc:'Hüpft heran und greift schnell an.'},camel:{name:'Kamel',desc:'Beschützt dich und schwächt den nächsten Treffer.'},ram:{name:'Widder',desc:'Stürmt mit mächtigen Hörnern los.'},bear:{name:'Bärenjunges',desc:'Ein kräftiger Tatzenhieb in jeder Runde.'},lion:{name:'Löwe',desc:'Ein mächtiges Brüllen, das hart trifft.'},star:{name:'Kleiner Stern',desc:'Leuchtet auf alle Gegner auf einmal.'},fish:{name:'Fisch',desc:'Ein großer heilender Spritzer jede Runde.'},goat:{name:'Ziege',desc:'Stößt kräftig mit dem Kopf.'},peacock:{name:'Pfau',desc:'Schillernde Federn treffen alle Gegner.'},eagle:{name:'Adler',desc:'„Sie fliegen hoch wie Adler.“ (nach Jesaja 40,31)'},
  rabbit:{name:'Hase',desc:'Schnelle kleine Sprünge, die zwicken.'},ox:{name:'Ochse',desc:'Steht stark vor dir. Er war an der Krippe dabei!'},rooster:{name:'Hahn',desc:'Ein lautes Krähen kann einen Gegner eine Runde erstarren lassen.'},sparrow:{name:'Spatz',desc:'Findet nach Kämpfen Extra-Schekel. Gott sorgt für die Spatzen (Matthäus 10,29).'},owl:{name:'Eule',desc:'Ein weiser Blick, der einen Gegner eine Runde stoppt.'},bee:{name:'Biene',desc:'Summt alle Gegner auf einmal an. Simson fand Honig in einem Löwen (Richter 14,8)!'},deer:{name:'Hirsch',desc:'Sanfte Heilung. „Wie der Hirsch nach frischem Wasser lechzt ...“ (nach Psalm 42,2)'},turtle:{name:'Schildkröte',desc:'Ein harter Panzer, der große Treffer abhält.'},fox:{name:'Fuchs',desc:'Erschnüffelt nach jedem Sieg versteckte Schekel.'},whale:{name:'Großer Fisch',desc:'Ein gewaltiger Platscher. Denk an Jona (Jona 2,1)!'}},
 CH:{
 1:{name:'Garten Eden',book:'1. Mose 1–3',foe:{name:'Flüsterling',pl:'Flüsterlinge',what:'kleine Schatten der Lüge'},foes:[{name:'Flüsterling'},{name:'Schwindelwicht'},{name:'Rankenwirrer'}],
  boss:{name:'Schatten des Verführers',where:'beim Baum des Lebens'},guide:{name:'Eva'},
  intro:['Willkommen, Pilger! Das ist der Garten Eden. Hier hat Gott alles gemacht – und es war sehr gut.','Licht am ersten Tag. Himmel, Meere, Pflanzen, Sonne, Mond und Sterne. Fische und Vögel, Tiere – und am sechsten Tag die Menschen!','Aber ein lügnerisches Flüstern hat sich in den Garten geschlichen. Jetzt verderben Düsterlinge alles.','Antworte mit der Wahrheit, dann lösen sie sich auf! Besiege 4 von ihnen, dann zeigt sich der Schatten des Verführers beim Baum des Lebens.'],
  hint:'Der Schatten des Verführers wartet beim Baum des Lebens. Gottes Wahrheit ist stärker als jede Lüge!',
  outro:['Du hast es geschafft! Die Lüge hat keine Macht über die Wahrheit.','Als Adam und ich ungehorsam waren, kam Traurigkeit in die Welt. Aber Gott gab sofort ein Versprechen: Eines Tages kommt ein Retter, der der Schlange den Kopf zertritt (1. Mose 3,15).','Nimm dieses erste Teil der Schriftrolle des Lichts – und den Gürtel der Wahrheit.'],
  post:'Gott hat alles angesehen, was er gemacht hat, und es war sehr gut. Du auch!',
  side:{name:'Adam',what:'Tiere ohne Namen',ask:'Gott hat mir die Tiere gebracht, damit ich ihnen Namen gebe. Fast alle haben schon einen – aber drei sind weggelaufen! Findest du sie? Eine Giraffe, einen Igel und eine Schildkröte.',thanks:'Wunderbar! Dieses hier nenne ich ... Giraffe. Ja! Danke, mein Freund. Und dieser kleine Hase möchte mit dir gehen.'},
  flav:[{name:'Gabriel',lines:['Tipp: Tippe einen Düsterling an oder lauf in ihn hinein, um einen Kampf zu beginnen.','Jede richtige Antwort macht deinen Angriff stark. Drei richtige hintereinander geben eine Geist-Serie!']},{name:'Der kleine Abel',lines:['Wenn ich groß bin, werde ich Hirte! Lämmer mag ich am liebsten.']}],
  verse:{t:'Gott sah alles an, was er gemacht hatte – und es war sehr gut!',r:'1. Mose 1,31'}},
 2:{name:'Berge von Ararat',book:'1. Mose 6–9',foe:{name:'Spötter',pl:'Spötter',what:'düstere Schatten des Spotts'},foes:[{name:'Spötter'},{name:'Pfützendunkel'},{name:'Donnerpuff'}],
  boss:{name:'Das Spott-Dunkel',where:'bei der Arche'},guide:{name:'Noah'},
  intro:['Ahoi, Pilger! Das Wasser geht endlich zurück, und unsere Arche ist auf den Bergen von Ararat gelandet.','Jahrelang haben die Leute gelacht, während ich gebaut habe. Aber Gott hat gesagt: Bau! Also habe ich gebaut.','Jetzt ziehen Spötter durch die Hügel und erzählen allen, Gottes Versprechen seien nicht wahr.','Bring 5 Düsterlinge mit richtigen Antworten zum Schweigen, dann kommt das Spott-Dunkel zur Arche herunter.'],
  hint:'Das Spott-Dunkel ist bei der Arche. Wer über Gottes Versprechen lacht, macht sie nicht weniger wahr!',
  outro:['Die Wolken reißen auf – schau, ein Regenbogen!','Gott hat seinen Bogen in die Wolken gesetzt. Er verspricht: Nie wieder wird eine Flut die ganze Erde zerstören. Gott hält immer, was er verspricht.','Nimm dieses Teil der Schriftrolle und die Schuhe des Friedens. Und diese kleine Taube möchte mit dir fliegen!'],
  post:'Jeder Regenbogen erinnert uns daran: Gott hält seine Versprechen.',
  side:{name:'Sem',what:'Olivenzweige',ask:'Die Taube hat ein Olivenblatt gebracht, da wussten wir: Das Land wird trocken! Findest du 3 Olivenzweige? Wir wollen neue Bäume pflanzen.',thanks:'Danke! Neues Leben nach der Flut. Hier, nimm das.'},
  flav:[{name:'Noahs Frau',lines:['Monatelang auf einem Boot mit allen möglichen Tieren. So viel Heu habe ich noch nie gesehen!']},{name:'Jafet',lines:['Tipp: Bei Lydia in der Pilgerrast kannst du Brot und Fisch zum Heilen kaufen.']}],
  verse:{t:'Ich setze meinen Regenbogen in die Wolken. Er ist das Zeichen für mein Versprechen an die Erde.',r:'1. Mose 9,13'}},
 3:{name:'Land Ägypten',book:'2. Mose 1–15',foe:{name:'Aufgeblasling',pl:'Aufgeblaslinge',what:'Schatten des Hochmuts'},foes:[{name:'Aufgeblasling'},{name:'Froschdunkel'},{name:'Sandschatten'}],
  boss:{name:'Dunkel des harten Herzens',where:'bei der Pyramide'},guide:{name:'Mose'},
  intro:['Ich bin Mose. Gott hat aus einem Dornbusch zu mir gesprochen, der brannte, aber nicht verbrannte!','Er hat mich mit einer Botschaft zum Pharao geschickt: „Lass mein Volk gehen!“ Aber das Herz des Pharao war hart und stolz.','Aufgeblaslinge schweben am ganzen Nil entlang. Sie blähen sich groß auf – aber die Wahrheit lässt sie platzen.','Besiege 5 Düsterlinge. Dann stellen wir uns dem Dunkel des harten Herzens bei der Pyramide.'],
  hint:'Das Dunkel des harten Herzens wartet bei der Pyramide. Hochmut kommt vor dem Fall!',
  outro:['Das Meer hat sich geteilt! Gott hat einen trockenen Weg mitten durchs Wasser gemacht!','„Der Herr kämpft für euch. Ihr dürft ganz ruhig bleiben.“ Gott hat getan, was wir niemals gekonnt hätten.','Hier ist das nächste Teil der Schriftrolle und der Brustpanzer der Gerechtigkeit. Ach – und einer der Frösche aus den Plagen mag dich.'],
  post:'Gott hat gehört, wie sein Volk zu ihm schrie – und er ist gekommen, um es zu retten.',
  side:{name:'Mirjam',what:'Schilfkörbe',ask:'Als mein Bruder Mose ein Baby war, habe ich auf seinen kleinen Korb im Fluss aufgepasst. Jetzt hat der Wind drei meiner Körbe weggeweht! Findest du sie?',thanks:'Du hast sie gefunden! Lasst uns dem Herrn singen! Hier ist etwas für deine Reise.'},
  flav:[{name:'Aaron',lines:['Ich bin der Bruder von Mose. Ich habe für ihn gesprochen, wenn er nervös war. Gott schenkt uns Helfer!']},{name:'Ziegelmacher',lines:['Ziegel, Ziegel, Ziegel ... und jetzt nicht mal mehr Stroh! Wir brauchen Gottes Hilfe.']}],
  verse:{t:'Der Herr kämpft für euch. Ihr dürft ganz ruhig bleiben.',r:'2. Mose 14,14'}},
 4:{name:'Wüste Sinai',book:'2. Mose 16–32',foe:{name:'Murrling',pl:'Murrlinge',what:'Schatten des Meckerns'},foes:[{name:'Murrling'},{name:'Durstflämmchen'},{name:'Goldgroll'}],
  boss:{name:'Goldenes-Kalb-Dunkel',where:'am Fuß des Berges Sinai'},guide:{name:'Aaron'},
  intro:['Willkommen in der Wüste, Pilger. Jeden Morgen schickt Gott Manna – Brot vom Himmel!','Mein Bruder Mose ist oben auf dem Berg Sinai und empfängt Gottes Gebote.','Aber Murrlinge verbreiten im Lager Beschwerden: „Wir haben Durst! Uns ist langweilig! In Ägypten war alles besser!“','Bring 5 Düsterlinge zum Schweigen, dann stell dich dem Goldenes-Kalb-Dunkel. Ich schäme mich, dass ich beim Bau des Kalbs geholfen habe.'],
  hint:'Das Goldenes-Kalb-Dunkel ist am Fuß des Berges Sinai. Nur Gott verdient unsere Anbetung!',
  outro:['Das Kalb ist weg. Mose ist mit den Zehn Geboten heruntergekommen – Gottes guter Weg zum Leben.','Gott hat seinem Volk vergeben und ist bei ihm geblieben: tagsüber in einer Wolkensäule und nachts in einer Feuersäule.','Hier ist das nächste Teil der Schriftrolle. Und dieses Kamel liebt lange Wüstenwanderungen!'],
  post:'Du sollst keine anderen Götter haben neben mir. Gott kommt zuerst!',
  side:{name:'Kaleb',what:'Mannakrüge',ask:'Gott hat gesagt, wir sollen einen Krug Manna aufheben, damit wir nie vergessen, wie er uns versorgt hat. Drei Krüge sind vom Karren gerollt! Hilfst du mir?',thanks:'Alle drei! Gott versorgt uns jeden einzelnen Tag. Nimm das hier!'},
  flav:[{name:'Bezalel',lines:['Gott hat mir Geschick gegeben, um die Stiftshütte zu bauen. Deine Talente sind auch Geschenke von ihm!']},{name:'Josua',lines:['Tipp: Ab Stufe 3 lernst du den Hoffnungsschild. Setz ihn ein, wenn Gegner hart zuschlagen!']}],
  verse:{t:'Du sollst keine anderen Götter haben neben mir.',r:'2. Mose 20,3'}},
 5:{name:'Jericho',book:'Josua 1–6',foe:{name:'Sorgling',pl:'Sorglinge',what:'Schatten der Sorge'},foes:[{name:'Sorgling'},{name:'Mauerglotzer'},{name:'Bangwisch'}],
  boss:{name:'Mauern der Angst',where:'an den Mauern von Jericho'},guide:{name:'Josua'},
  intro:['Sei stark und mutig! Das hat Gott zu mir gesagt, und jetzt sage ich es dir.','Wir sind trockenen Fußes durch den Jordan gegangen. Jetzt stehen die großen Mauern von Jericho vor uns.','Überall flüstern Sorglinge: „Diese Mauern sind viel zu groß!“','Besiege 5 Düsterlinge. Dann marschieren wir! Die Mauern der Angst fallen nach 7 Runden – das heißt: 7 richtige Antworten!'],
  hint:'Zieh um die Mauern der Angst! Jede richtige Antwort ist eine Runde um die Stadt. Nach sieben Runden fallen sie!',
  outro:['Die Posaunen haben geblasen, das Volk hat gejubelt – und die Mauern sind eingestürzt!','Gott hat den Kampf gewonnen, genau wie er es versprochen hat. Und Rahab und ihre Familie wurden gerettet, weil sie Gott vertraut hat.','Hier ist das nächste Teil der Schriftrolle – und der Schild des Glaubens! Dieser Widder will auch mit. Aus seinen Hörnern werden tolle Posaunen.'],
  post:'Sei stark und mutig. Der Herr, dein Gott, ist bei dir, wohin du auch gehst!',
  side:{name:'Rahab',what:'rote Schnüre',ask:'Ich habe eine rote Schnur aus meinem Fenster gehängt, damit meine Familie gerettet wird. Ich möchte welche für meine Schwestern! Findest du 3 rote Schnüre?',thanks:'Danke! Der Gott Israels ist der wahre Gott. Nimm das als Dank.'},
  flav:[{name:'Priester',lines:['Wir tragen die Bundeslade und blasen auf Posaunen aus Widderhörnern!']},{name:'Kaleb',lines:['Ich bin 85 und immer noch stark! Wer Gott vertraut, wird nie zu alt.']}],
  verse:{t:'Sei mutig und stark! Hab keine Angst, denn der Herr, dein Gott, ist bei dir, wohin du auch gehst.',r:'Josua 1,9'}},
 6:{name:'Tal Ela',book:'1. Samuel 16–17',foe:{name:'Zitterling',pl:'Zitterlinge',what:'zittrige Schatten der Angst'},foes:[{name:'Zitterling'},{name:'Bibberschatten'},{name:'Großmaul'}],
  boss:{name:'Riese der Angst',where:'beim Lager der Philister'},guide:{name:'David'},
  intro:['Hallo! Ich bin David. Ich hüte die Schafe meines Vaters.','Jeden Tag brüllt ein Riese namens Goliat unser Heer an, und alle haben zu viel Angst, gegen ihn zu kämpfen.','Seine Angst hat sich in Zitterlinge verwandelt – wackelige Schatten, die Menschen klein fühlen lassen.','Besiege 6 Düsterlinge. Dann stellen wir uns dem Riesen der Angst. Goliat hat Schwert und Speer, aber ich komme im Namen des Herrn!'],
  hint:'Der Riese der Angst ist beim Lager der Philister. Der Kampf gehört dem Herrn!',
  outro:['Ein Stein, und der Riese ist gefallen! Der Kampf gehört dem Herrn.','Gott schaut nicht darauf, wie groß oder stark jemand ist. Er schaut ins Herz.','Nimm das nächste Teil der Schriftrolle. Und dieses Bärenjunge ist mir aus den Hügeln gefolgt – es ist jetzt ganz lieb, versprochen!'],
  post:'Der Herr ist mein Hirte. Mir wird nichts fehlen.',
  side:{name:'Jonatan',what:'glatte Steine',ask:'Ich bin Jonatan, der Sohn von König Saul. David braucht glatte Steine aus dem Bach. Findest du 5 davon?',thanks:'Fünf glatte Steine! David ist mein bester Freund. Hier – nimm das.'},
  flav:[{name:'Soldat',lines:['Dieser Riese ist fast drei Meter groß! Ich gehe da nicht raus ...']},{name:'Eliab',lines:['Mein kleiner Bruder David glaubt, er kann Goliat besiegen? Pff.']}],
  verse:{t:'Menschen sehen nur, was vor Augen ist. Aber Gott sieht ins Herz.',r:'1. Samuel 16,7'}},
 7:{name:'Babylon',book:'Daniel 1–6',foe:{name:'Angeber',pl:'Angeber',what:'Schatten der Prahlerei'},foes:[{name:'Angeber'},{name:'Götzenwicht'},{name:'Rauchwisch'}],
  boss:{name:'Das goldene Standbild',where:'beim großen Tempelturm'},guide:{name:'Daniel'},
  intro:['Friede sei mit dir. Ich bin Daniel, weit weg von meiner Heimat Jerusalem.','Der König hat ein riesiges goldenes Standbild gebaut und befohlen, dass sich alle davor verbeugen.','Meine Freunde Schadrach, Meschach und Abed-Nego haben sich nicht verbeugt – und Gott war bei ihnen, sogar im glühenden Ofen!','Angeber füllen die Straßen. Besiege 6 Düsterlinge, dann stürz das goldene Standbild.'],
  hint:'Das goldene Standbild steht beim großen Tempelturm. Es gibt keinen Gott wie unseren Gott!',
  outro:['Das Standbild ist umgestürzt! Es gibt keinen anderen Gott, der so retten kann.','Später wurde ich in die Löwengrube geworfen, weil ich gebetet habe. Aber Gott hat seinen Engel geschickt und den Löwen das Maul verschlossen.','Hier ist das nächste Teil der Schriftrolle und der Helm der Rettung. Und dieser Löwe wäre gern dein Freund. Er ist ganz sanft!'],
  post:'Bete weiter, jeden Tag – so wie ich.',
  side:{name:'Meschach',what:'Gemüsekörbe',ask:'Wir haben darum gebeten, Gemüse und Wasser statt des Essens vom König zu bekommen – und Gott hat uns gesund und stark gemacht! Aber drei Karottenkörbe sind verschwunden.',thanks:'Danke! Möchtest du eine Karotte? Nein? Dann nimm lieber das hier.'},
  flav:[{name:'Schadrach',lines:['Der König hat einen vierten Mann mit uns im Feuer gesehen! Gott hat uns nie allein gelassen.']},{name:'Abed-Nego',lines:['Wir kamen aus dem Ofen und haben nicht mal nach Rauch gerochen!']}],
  verse:{t:'Mein Gott hat seinen Engel geschickt und den Löwen das Maul verschlossen. Sie haben mir nichts getan.',r:'Daniel 6,23'}},
 8:{name:'Betlehem',book:'Lukas 2 · Matthäus 2',foe:{name:'Finsterling',pl:'Finsterlinge',what:'Schatten der Dunkelheit'},foes:[{name:'Finsterling'},{name:'Nachtglotzer'},{name:'Schattentropfen'}],
  boss:{name:'Nacht-Dunkel',where:'über dem Stall'},guide:{name:'Josef'},
  intro:['Schalom, Reisender. Ich bin Josef. Maria und ich sind nach Betlehem gekommen, um uns zählen zu lassen.','In der Herberge war kein Platz, darum wurde das Kind Jesus in einem Stall geboren und in eine Futterkrippe gelegt.','Engel haben den Hirten die gute Nachricht erzählt! Aber Finsterlinge verdecken den Weg für alle, die noch kommen wollen.','Vertreib 6 Düsterlinge, dann stell dich dem Nacht-Dunkel, damit der Stern leuchten kann.'],
  hint:'Das Nacht-Dunkel schwebt über dem Stall. Das Licht scheint in der Dunkelheit!',
  outro:['Schau, wie der Stern leuchtet! Sterndeuter aus dem Osten folgen ihm bis hierher.','„Heute ist euch in der Stadt Davids der Retter geboren: Christus, der Herr!“','Das ist das nächste Teil der Schriftrolle. Und dieser kleine Stern will dir anscheinend überallhin folgen!'],
  post:'Immanuel – Gott ist mit uns!',
  side:{name:'Hirtenjunge',what:'verlorene Schafe',ask:'Als die Engel gesungen haben, sind wir losgerannt, um das Kind zu sehen – und drei meiner Schafe sind im Dunkeln weggelaufen! Hilfst du mir suchen?',thanks:'Du hast jedes einzelne gefunden! Ein guter Hirte gibt ein verlorenes Schaf nie auf. Und dieser Ochse aus dem Stall möchte mit dir gehen.'},
  flav:[{name:'Engel',lines:['Ehre sei Gott im Himmel, und Frieden auf der Erde für die Menschen, die er liebt!']},{name:'Wirt',lines:['Kein Platz mehr! Es tut mir so leid – der Stall war alles, was ich hatte. Wer hätte gedacht, dass dort ein König geboren wird?']}],
  verse:{t:'Heute ist euch in der Stadt Davids der Retter geboren: Christus, der Herr!',r:'Lukas 2,11'}},
 9:{name:'See Genezareth',book:'Die Evangelien',foe:{name:'Sorgenwelle',pl:'Sorgenwellen',what:'Schatten der Sorge'},foes:[{name:'Sorgenwelle'},{name:'Böengeist'},{name:'Tiefendunkel'}],
  boss:{name:'Sturm der Angst',where:'beim Boot auf dem See'},guide:{name:'Petrus'},
  intro:['Hallo! Ich bin Petrus. Früher habe ich Fische gefangen – jetzt sagt Jesus, ich soll Menschen für Gott gewinnen!','Jesus hat hier unglaubliche Dinge getan: 5000 Menschen mit 5 Broten und 2 Fischen satt gemacht, Kranke geheilt und ist sogar über das Wasser gegangen!','Aber Sorgenwellen wühlen den See auf.','Beruhige 6 Düsterlinge, dann stell dich dem Sturm der Angst draußen beim Boot. Keine Sorge – Jesus ist mit im Boot!'],
  hint:'Der Sturm der Angst tobt beim Boot. Geh über den Steg hinaus und stell dich ihm!',
  outro:['Jesus ist aufgestanden und hat gesagt: „Schweig! Sei still!“ Und Wind und Wellen haben ihm gehorcht!','Als ich über das Wasser ging und Angst bekam, fing ich an zu sinken. Aber Jesus hat meine Hand gepackt. Er hält auch deine.','Nimm das nächste Teil der Schriftrolle – und das Schwert des Geistes, das ist Gottes Wort. Und natürlich einen Fisch als Freund!'],
  post:'Folge Jesus – das ist das beste Abenteuer überhaupt.',
  side:{name:'Andreas',what:'Brote und Fische',ask:'Ein Junge hat Jesus sein Essen geschenkt – 5 Brote und 2 Fische –, aber er hat alles am Hang fallen lassen! Findest du alle 7 Stücke?',thanks:'Alle fünf Brote und beide Fische! Jesus kann mit einem kleinen Geschenk so viel machen.'},
  flav:[{name:'Matthäus',lines:['Ich war Zolleinnehmer. Jesus sagte „Folge mir!“, und ich habe alles stehen lassen. Die beste Entscheidung meines Lebens.']},{name:'Kleines Mädchen',lines:['Jesus hat gesagt: „Lasst die Kinder zu mir kommen!“ Er hat für alle Zeit.']}],
  verse:{t:'Folgt mir nach! Ich will euch zeigen, wie ihr Menschen für Gott gewinnt.',r:'Matthäus 4,19'}},
 10:{name:'Jerusalem',book:'Die Evangelien · Ostern',foe:{name:'Zweifling',pl:'Zweiflinge',what:'Schatten des Zweifels'},foes:[{name:'Zweifling'},{name:'Angststachel'},{name:'Trübsaltropfen'}],
  boss:{name:'Der Schatten des Zweifels',where:'beim Gartengrab'},guide:{name:'Maria Magdalena'},
  intro:['Pilger, du hast einen weiten Weg hinter dir. Das hier ist Jerusalem.','Jesus ist auf einem Esel hereingeritten, und die Leute haben Palmzweige geschwenkt. Dann wurde er gefangen genommen und ist für uns alle am Kreuz gestorben.','Sie haben ihn in ein Grab gelegt und einen großen Stein davorgerollt. Alles fühlte sich dunkel an.','Der Schatten des Zweifels selbst ist hier und flüstert, dass alles aus ist. Besiege 7 Düsterlinge, dann stell dich dem Schatten beim Gartengrab!'],
  hint:'Der Schatten des Zweifels wartet beim Gartengrab. Denk daran, was Jesus versprochen hat!',
  outro:['Pilger! Der Stein ist weggerollt! Das Grab ist LEER!','Der Engel hat gesagt: „Er ist nicht hier. Er ist auferstanden, genau wie er es gesagt hat!“ Jesus lebt!','Tod und Dunkelheit konnten ihn nicht festhalten. Das ist die beste Nachricht der ganzen Geschichte.','Hier ist dieses Teil der Schriftrolle.'],
  post:'Er ist auferstanden! Geh und erzähl allen die gute Nachricht.',
  side:{name:'Kind mit Palmzweigen',what:'Palmzweige',ask:'Als Jesus auf dem Esel kam, haben wir Palmzweige geschwenkt und „Hosianna!“ gerufen. Drei von meinen habe ich verloren. Hilfst du mir?',thanks:'Hosianna! Gelobt sei, der da kommt im Namen des Herrn! Danke! Und dieser Hahn kräht so laut, er soll dich begleiten.'},
  flav:[{name:'Thomas',lines:['Das glaube ich erst, wenn ich es mit eigenen Augen sehe ...','(Später sah Thomas Jesus und sagte: „Mein Herr und mein Gott!“ – Johannes 20,28)']},{name:'Johannes',lines:['Tipp: Der Mutstoß kommt ab Stufe 5, die Welle der Weisheit ab Stufe 8. Hier wirst du sie brauchen!']}],
  verse:{t:'Er ist nicht hier. Er ist auferstanden, genau wie er es gesagt hat!',r:'Matthäus 28,6'}}
 }
};
DE.CH[1].side.thanks=DE.CH[1].side.thanks; // (rabbit mentioned in text)

const STORY_DE = [
 'Vor langer Zeit erzählte die große Schriftrolle des Lichts die ganze Geschichte von Gottes Liebe – vom allerersten Sonnenaufgang bis zum hellsten Morgen von allen.',
 'Doch der Schatten des Zweifels schlich sich heran. Er zerriss die Schriftrolle in achtzehn Teile und versteckte sie in den Zeiten der Bibel.',
 'Ohne die Schriftrolle breiteten sich Düsterlinge überall aus: Flüstern von Lügen, Sorgen, Hochmut und Angst.',

  "Chainlings want to stop the good news. Defeat 7 of them, then face the Chains of Fear by the shipwreck."],

 side:{name:'Luke',look:{skin:SK[1],hair:'#a8642a',robe:'#2f8f8a',sash:'#e9d8a6',beard:'#a8642a'},items:['✉️','✉️','✉️','✉️'],what:"Paul's letters",

Object.assign(DE.COMPS,{stars:{name:'Sternschnuppe',desc:'Lässt Funken auf alle Gegner regnen. „Zähl die Sterne“ (nach 1. Mose 15,5).'},cow:{name:'Kuh',desc:'Gleichmäßige Heilung. Denk an den Traum des Pharao von sieben fetten Kühen!'},mouse:{name:'Feldmaus',desc:'Sammelt nach jedem Sieg Extra-Schekel – wie Rut auf dem Feld.'},horse:{name:'Feuerpferd',desc:'Galoppiert mit voller Kraft heran. Elia fuhr mit Feuerpferden in den Himmel (2. Könige 2,11).'},worm:{name:'Kleiner Wurm',desc:'Klein, aber überraschend. Kann einen Gegner eine Runde erstarren lassen (Jona 4,7).'},flame:{name:'Geistflamme',desc:'Warmes Licht, das alle Gegner auf einmal erreicht (Apostelgeschichte 2,3).'},boat:{name:'Segelboot',desc:'Schützt dich vor großen Treffern – wie ein Boot im Sturm.'}});

Object.assign(DE.CH,{
11:{name:'Ebene von Kanaan',book:'1. Mose 11–22',foe:{name:'Zappelling',pl:'Zappellinge',what:'Schatten der Ungeduld'},foes:[{name:'Zappelling'},{name:'Eilwicht'},{name:'Staubgroll'}],
 boss:{name:'Turm-von-Babel-Dunkel',where:'bei Abrahams Zelten'},guide:{name:'Abraham'},
 intro:['Willkommen, Reisender! Ich bin Abraham. Vor Kurzem haben Menschen in Babel einen hohen Turm gebaut, um selbst berühmt zu werden, statt Gott zu vertrauen.','Gott hat sie zerstreut. Dann hat er mich gerufen: Verlass deine Heimat und geh in ein Land, das ich dir zeigen werde. Also bin ich gegangen!','Gott hat mir so viele Nachkommen versprochen wie Sterne am Himmel. Sara und ich warten schon sehr, sehr lange.','Zappellinge flüstern: „Gib auf! Das dauert viel zu lange!“ Besiege 4 Düsterlinge, dann stell dich dem Turm-von-Babel-Dunkel bei meinen Zelten.'],
 hint:'Das Turm-von-Babel-Dunkel ragt bei meinen Zelten auf. Gott zu vertrauen ist besser, als einen eigenen Turm zu bauen!',
 outro:['Der Turm ist gefallen! Gottes Weg ist immer besser als unsere eigenen stolzen Pläne.','Und schau – Sara und ich haben einen Sohn, Isaak! Ist für den Herrn irgendetwas zu schwer?','Nimm dieses Teil der Schriftrolle. Und diese Sternschnuppe möchte mit dir gehen – zählt zusammen die Sterne!'],
 post:'Schau hinauf zu den Sternen. Gott hält jedes Versprechen, auch wenn wir warten müssen.',
 side:{name:'Sara',what:'verlaufene Ziegen',ask:'Drei unserer Ziegen sind weggelaufen, während ich über die gute Nachricht gelacht habe! Findest du sie für mich?',thanks:'Du hast alle gefunden! Gott hat mich vor Freude lachen lassen. Hier, nimm das.'},
 flav:[{name:'Lot',lines:['Ich bin Abrahams Neffe. Er hat mich zuerst das beste Land aussuchen lassen. So sieht ein großzügiges Herz aus!']},{name:'Isaak',lines:['Mein Name bedeutet „er lacht“! Mama hat gelacht, als Gott sagte, dass sie mit neunzig ein Baby bekommt.']}],
 verse:{t:'Ist für den Herrn irgendetwas zu schwer?',r:'1. Mose 18,14'}},
12:{name:'Josefs Weg',book:'1. Mose 37–50',foe:{name:'Neidling',pl:'Neidlinge',what:'Schatten des Neides'},foes:[{name:'Neidling'},{name:'Grolltropfen'},{name:'Grubenglotzer'}],
 boss:{name:'Neid-Dunkel',where:'bei den Kornspeichern'},guide:{name:'Josef'},
 intro:['Hallo! Ich bin Josef. Mein Vater hat mir einen wunderschönen bunten Mantel geschenkt.','Meine Brüder waren so neidisch, dass sie mich an Händler verkauft haben. So wurde ich Sklave in Ägypten – und kam sogar ins Gefängnis!','Aber Gott war bei mir. Er hat mir geholfen, die Träume des Pharao zu deuten, und jetzt sammle ich Getreide für sieben hungrige Jahre.','Neidlinge stiften Unruhe. Besiege 5 Düsterlinge, dann stell dich dem Neid-Dunkel bei den Kornspeichern.'],
 hint:'Das Neid-Dunkel bewacht die Kornspeicher. Neid tut nur weh – Vergebung heilt!',
 outro:['Der Neid ist weg. Meine Brüder sind nach Ägypten gekommen, um Essen zu holen ... und ich habe ihnen vergeben.','Sie wollten mir Böses tun, aber Gott hat Gutes daraus gemacht – um viele Menschen am Leben zu erhalten.','Hier ist ein Teil der Schriftrolle. Und diese Kuh stammt aus der Herde des Pharao!'],
 post:'Der Herr war mit Josef – und er ist auch mit dir, sogar an schweren Orten.',
 side:{name:'Benjamin',what:'Silbermünzen',ask:'Unsere Silbermünzen lagen plötzlich wieder in unseren Getreidesäcken, und dann sind sie überall herausgefallen! Hilfst du mir, 3 davon zu finden?',thanks:'Danke! Mein Bruder Josef ist so gut zu uns. Nimm dir auch etwas.'},
 flav:[{name:'Ruben',lines:['Ich bin der älteste Bruder. Ich wünschte, ich hätte mich früher für Josef eingesetzt.']},{name:'Bäcker des Pharao',lines:['Ich habe von drei Brotkörben geträumt ... Josef wusste, was das bedeutet.']}],
 verse:{t:'Ihr wolltet mir Böses tun, aber Gott hat Gutes daraus gemacht.',r:'1. Mose 50,20'}},
13:{name:'Ruts Felder',book:'Rut 1–4',foe:{name:'Einsamling',pl:'Einsamlinge',what:'Schatten der Einsamkeit'},foes:[{name:'Einsamling'},{name:'Hungerflämmchen'},{name:'Distelgroll'}],
 boss:{name:'Dunkel der Einsamkeit',where:'bei den Gerstenfeldern'},guide:{name:'Rut'},
 intro:['Hallo, mein Freund. Ich bin Rut. Ich komme aus Moab, weit weg von hier.','Als mein Mann starb, hätte ich nach Hause gehen können. Aber ich habe zu Noomi gesagt: „Wo du hingehst, da gehe ich auch hin. Dein Gott ist mein Gott.“','Jetzt sammle ich übrig gebliebene Gerste auf den Feldern eines freundlichen Mannes namens Boas, damit Noomi und ich zu essen haben.','Einsamlinge lassen Menschen sich vergessen fühlen. Besiege 5 Düsterlinge, dann stell dich dem Dunkel der Einsamkeit bei den Gerstenfeldern.'],
 hint:'Das Dunkel der Einsamkeit ist bei den Gerstenfeldern. Gott vergisst niemanden!',
 outro:['Du hast die Einsamkeit vertrieben! Boas war so freundlich – und jetzt sind wir verheiratet.','Wir haben einen kleinen Jungen namens Obed. Eines Tages wird sein Enkel König David sein!','Nimm dieses Teil der Schriftrolle. Und diese Feldmaus möchte dir helfen, Schekel zu sammeln.'],
 post:'Treue Liebe ist ein Geschenk von Gott. Halte zu den Menschen, die er dir schenkt!',
 side:{name:'Noomi',what:'Gerstenbündel',ask:'Rut arbeitet so hart auf dem Feld. Könntest du 4 Gerstenbündel für uns sammeln?',thanks:'Gott segne dich, Kind! Gott hat uns doch nicht vergessen.'},
 flav:[{name:'Boas',lines:['Ich habe meinen Arbeitern gesagt, sie sollen extra Gerste für Rut liegen lassen. Freundlichkeit kostet wenig und bedeutet viel.']},{name:'Erntehelfer',lines:['Tipp: Essen heilt dich im Kampf. Gerstenbrot ist bei Lydia ganz billig!']}],
 verse:{t:'Wo du hingehst, da gehe ich auch hin. Dein Volk ist mein Volk, und dein Gott ist mein Gott.',r:'Rut 1,16'}},
14:{name:'Berg Karmel',book:'1. Könige 17–19',foe:{name:'Trugflamme',pl:'Trugflammen',what:'Schatten falscher Götter'},foes:[{name:'Trugflamme'},{name:'Dürretropfen'},{name:'Baalswicht'}],
 boss:{name:'Das falsche Feuer',where:'am Altar auf dem Karmel'},guide:{name:'Elia'},
 intro:['Ich bin Elia, ein Prophet des Herrn. Schon lange hat es im Land nicht mehr geregnet.','Gott hat Raben geschickt, die mir Essen brachten, und er hat das Mehl und Öl einer Witwe nicht ausgehen lassen.','Jetzt sagen die Propheten Baals, ihr falscher Gott sei stärker. Wir werden sehen, welcher Gott mit Feuer antwortet!','Überall sind Trugflammen. Besiege 5 Düsterlinge, dann stell dich dem falschen Feuer am Altar auf dem Karmel.'],
 hint:'Das falsche Feuer brennt am Altar. Nur der Herr ist Gott!',
 outro:['Feuer fiel vom Himmel und verbrannte den ganzen nassen Altar! Das Volk rief: „Der Herr ist Gott!“','Später war ich müde und hatte Angst. Gott sprach nicht im Sturm, nicht im Erdbeben und nicht im Feuer – sondern in einem leisen, sanften Säuseln.','Hier ist ein Teil der Schriftrolle. Und dieses Feuerpferd würde gern neben dir galoppieren!'],
 post:'Wenn du müde bist oder Angst hast: Hör hin. Gott spricht sanft.',
 side:{name:'Witwe von Sarepta',what:'Oliven für Öl',ask:'Gott hat meinen Ölkrug nie leer werden lassen! Aber ich möchte mit meinen Nachbarn teilen. Findest du 3 Olivenzweige?',thanks:'Gott gibt mehr als genug. Bitte nimm das!'},
 flav:[{name:'Elisa',lines:['Eines Tages werde ich Elias Arbeit weiterführen. Im Moment lerne ich, auf Gott zu hören.']},{name:'Obadja',lines:['Ich habe hundert Propheten in Höhlen versteckt und ihnen Brot und Wasser gebracht. Mutige Freundlichkeit!']}],
 verse:{t:'Nach dem Feuer kam ein leises, sanftes Säuseln.',r:'1. Könige 19,12'}},
15:{name:'Weg nach Ninive',book:'Jona 1–4',foe:{name:'Ausreißer',pl:'Ausreißer',what:'Schatten des Weglaufens'},foes:[{name:'Ausreißer'},{name:'Schmollstachel'},{name:'Tiefseeglotzer'}],
 boss:{name:'Weglauf-Dunkel',where:'am Stadttor von Ninive'},guide:{name:'Jona'},
 intro:['Hallo ... ich bin Jona. Gott hat gesagt, ich soll nach Ninive gehen und die Stadt warnen. Ich wollte nicht, also bin ich auf ein Schiff in die andere Richtung gestiegen.','Ein riesiger Sturm kam, die Seeleute warfen mich über Bord, und ein großer Fisch hat mich verschluckt!','Drei Tage lang habe ich in dem Fisch gebetet. Dann hat er mich an den Strand gespuckt. Okay, Gott – ich gehe!','Ausreißer sagen den Leuten, sie sollen sich vor Gott verstecken. Besiege 5 Düsterlinge, dann stell dich dem Weglauf-Dunkel am Stadttor von Ninive.'],
 hint:'Das Weglauf-Dunkel wirbelt am Stadttor. Vor Gottes Liebe kann man nicht davonlaufen!',
 outro:['Die ganze Stadt Ninive ist von ihren falschen Wegen umgekehrt, und Gott hat ihnen vergeben!','Zuerst war ich deswegen schlecht gelaunt. Aber Gott hat mir gezeigt, dass ihm jeder einzelne Mensch wichtig ist.','Hier ist ein Teil der Schriftrolle. Und dieser kleine Wurm ... na ja, er hat meine Schattenpflanze gefressen. Jetzt tut es ihm leid, und er will dein Freund sein!'],
 post:'Gottes Erbarmen ist größer, als wir denken – für sie und für uns.',
 side:{name:'Seemann',what:'Muscheln',ask:'Nach dem Sturm sind die Glücksmuscheln unseres Schiffes über den ganzen Strand verteilt. Findest du 4 davon?',thanks:'Ha! Danke, Freund. Wir Seeleute haben gelernt: Nur der Herr kann das Meer beruhigen.'},
 flav:[{name:'König von Ninive',lines:['Als ich Jonas Warnung hörte, habe ich mein Königsgewand ausgezogen und alle gebeten zu beten. Gott war barmherzig!']},{name:'Kapitän',lines:['Tipp: Tierfreunde mit „Lässt erstarren“ können den Angriff eines Gegners für eine ganze Runde stoppen.']}],
 verse:{t:'Rettung kommt allein vom Herrn.',r:'Jona 2,10'}},
16:{name:'Palast von Susa',book:'Ester 1–10',foe:{name:'Ränkling',pl:'Ränklinge',what:'Schatten böser Pläne'},foes:[{name:'Ränkling'},{name:'Planwicht'},{name:'Schattenhöfling'}],
 boss:{name:'Der böse Erlass',where:'beim Palast des Königs'},guide:{name:'Ester'},
 intro:['Willkommen im Palast von Susa. Ich bin Ester – ein Waisenmädchen, das Königin von Persien wurde!','Aber der böse Haman hat den König dazu gebracht, einen Erlass zu besiegeln, der mein Volk vernichten soll.','Mein Cousin Mordechai sagte: „Wer weiß, ob du nicht gerade für so eine Zeit wie diese Königin geworden bist?“ Also gehe ich zum König, auch wenn es gefährlich ist.','Ränklinge verbreiten den bösen Plan. Besiege 6 Düsterlinge, dann zerreiß den bösen Erlass beim Palast des Königs.'],
 hint:'Der böse Erlass wartet beim Palast. Sei mutig – Gott hat dich für so eine Zeit wie diese hierhergestellt!',
 outro:['Der König hat mir sein goldenes Zepter entgegengestreckt, mir zugehört – und mein Volk wurde gerettet!','Wir feiern das jedes Jahr mit dem Purimfest. Gottes Name steht in meiner Geschichte nicht einmal – aber er war die ganze Zeit dabei.','Nimm dieses Teil der Schriftrolle – und dieses königliche Gewand, damit du immer daran denkst, mutig zu sein.'],
 post:'Du bist nicht zufällig da, wo du bist. Sei mutig und freundlich!',

function interact(e){
  ac(); P.path=[]; P.pend=null; keys.up=keys.down=keys.left=keys.right=false;
  if(e.kind==='gate'){ if(!isOpen(e.ch)){ toast(t('gate.locked',POS(e.ch)-1)); return; } flash(); enterMap(e.ch); return; }
  if(e.kind==='exit'){ flash(); enterMap('hub',{x:2+(POS(M.id)-1)*3,y:17}); return; }
  if(e.kind==='home'){ openHouse(); return; }
  if(e.kind==='boss'){ const b=CH[M.id].boss; talk([L(CH[M.id].guide,t('boss.intro',b.name,CH[M.id].hint))],()=>startBattle(null,true)); return; }
  if(e.kind!=='npc') return;
  const who={name:e.name,look:e.look,angel:e.angel,opts:{staff:e.staff}};
  if(e.role==='flavor'){ talk((e.lk?t(e.lk):e.lines).map(x=>L(who,x))); return; }
  if(e.role==='elder') return elderTalk(who);
  if(e.role==='shop') return talk([L(who,t('shop.hi'))],openShop);
  if(e.role==='stable'){ if(!S.flags.met){ talk([L(who,t('stable.first'))]); return; } return talk([L(who,t('stable.hi'))],openStable); }
  if(e.role==='scribe') return talk([L(who,t('scribe.hi'))],openScribe);
  const id=M.id, c=S.chs[id], R=CH[id];
  if(e.role==='guide'){
    if(c.stage===0){ talk(R.intro.map(x=>L(who,x)),()=>{ c.stage=1; save(); updTrack(); toast(t('toast.quest',R.kills,t('gloomlings'))); }); }
    else if(c.stage===1){ talk([L(who,t('guide.progress',pl(R.foe),R.foe.what,c.kills,R.kills))]); }
    else if(c.stage===2){ talk([L(who,R.hint)]); }
    else if(c.stage===3){ talk(R.outro.map(x=>L(who,x)),()=>completeChapter(id)); }
    else talk([L(who,R.post)],askChampion);
    return;
  }
  if(e.role==='side'){ const sd=R.side;
    if(c.side===0) talk([L(who,sd.ask)],()=>{ c.side=1; save(); updTrack(); toast(t('side.toastFind',sd.items.length,sd.what)); });
    else if(c.side===1&&c.got.length>=sd.items.length) talk([L(who,sd.thanks)],()=>{ c.side=2; S.coins+=sd.reward.coins; addItem(sd.reward.item,1); SFX.coin(); toast(t('side.reward',sd.reward.coins,ITEMS[sd.reward.item].e,ITEMS[sd.reward.item].name));
      if(sd.reward.comp&&!S.comps[sd.reward.comp]){ S.comps[sd.reward.comp]={lvl:Math.max(1,S.level-2),xp:0}; setTimeout(()=>toast(t('toast.joined',COMPS[sd.reward.comp].e,COMPS[sd.reward.comp].name)),700); }
      save(); updHUD(); });
    else if(c.side===1) talk([L(who,t('side.still',sd.what,c.got.length,sd.items.length))]);
    else talk([L(who,t('side.thanksAgain'))]);
  }
}
function elderTalk(who){

  if(allDone()&&!S.flags.ending){ return ending(who); }
  const n=doneCount(), nx=nextOpen();
  talk([L(who, n>=NCH?t('elder.whole'):t('elder.progress',n,NCH)+(nx?t('elder.next',POS(nx),CH[nx].name):''))]);
}

  const c=S.chs[id], R=CH[id]; c.stage=4;

  if(rw.comp&&!S.comps[rw.comp]){ S.comps[rw.comp]={lvl:Math.max(1,S.level-2),xp:0}; got.push(COMPS[rw.comp].e+' '+COMPS[rw.comp].name); }

}

async function mechTurn(){ const bf=B.foes.find(f=>f.boss&&f.hp>0); if(!bf) return; const m=bf.mech, st=bf.m; if(!m) return;
  if(m.type==='regen'&&st.v<m.n){ const h=Math.round(bf.max*.06); bf.hp=Math.min(bf.max,bf.hp+h); floatText(bf.el,'+'+h+' ✨','heal'); msg(t('bm.calf.regen')); updBattle(); await sleep(450); }
  if(m.type==='furnace'&&st.v<m.n&&!(B.shield>0)){ const d=Math.max(1,Math.round(maxHP()*.05)); S.hp=Math.max(1,S.hp-d); floatText($('#bPlayer'),'−'+d+' 🔥','hurt'); updBattle(); await sleep(400); }
  if(m.type==='grow'){ st.lvl=Math.min(5,st.lvl+1); updBattle(); }
  if(m.type==='king'){ st.k=(st.k||0)+1; if(st.k%m.n===0){ st.crown=1; toast(t('bm.scroll.chance')); } }
  if(m.type==='mute'){ const opts=SPELLS.filter(sp=>S.level>=sp.lv&&sp.id!=='faith'); st.muted=opts.length?pick(opts).id:null; }
}
async function battleLoop(){
  while(true){
    const act=await waitAction(); $('#bSpells').innerHTML=''; const pl_=$('#bPlayer'); B.turn++;
    if(act.t==='flee'){ msg(t('b.fled')); await sleep(600); endBattle('flee'); return; }
    if(act.t==='item'){ const it=ITEMS[act.id]; S.items[act.id]--; const h=Math.min(maxHP()-S.hp,it.heal); S.hp+=h; SFX.heal(); floatText(pl_,'+'+Math.round(h),'heal'); msg(t('b.ate',it.name)); updBattle(); await sleep(600); }
    else {
      const sp=SPELLS.find(s=>s.id===act.id); const bf=B.foes.find(f=>f.boss&&f.hp>0); const forceCat=bf&&bf.mech.type==='truth'&&Math.random()<.5?'bible':null;
      const q=makeQuestion(B.ch,forceCat);
      msg(t('b.answerUp',sp.name));
      const ok=await ask(q,{boss:!!bf});
      if(ok){ B.streak++; const quick=S.style==='explorer'&&q.ms<7000; let mult=(B.streak>=3?1.5:1)*(.9+Math.random()*.2)*(quick?1.2:1); const alive=B.foes.filter(f=>f.hp>0);
        if(quick) floatText(pl_,t('b.quick'),'info');
        if(B.streak===3) toast(t('b.streakToast'));
        if(bf&&bf.mech.type==='streak'&&B.streak>=bf.mech.n&&(sp.id==='faith'||sp.id==='courage')){ mult*=2.2; floatText(bf.el,t('bm.giant.full'),'info'); }
        if(sp.id==='faith'||sp.id==='courage'){ const f=B.foes[B.target].hp>0?B.foes[B.target]:alive[0]; anim(pl_,'lunge-r'); await bolt(pl_,f.el); await hitFoe(f,Math.round(atkP()*(sp.id==='courage'?1.7:1)*mult),q); msg(t('b.hits',sp.name)); }
        else if(sp.id==='wisdom'){ anim(pl_,'lunge-r'); for(const f of alive){ bolt(pl_,f.el,'#9fd0ff'); } await sleep(420); for(const f of alive) await hitFoe(f,Math.round(atkP()*.85*mult),q); msg(t('b.wave')); }
        else if(sp.id==='pray'){ const h=Math.min(maxHP()-S.hp,Math.round(maxHP()*.35*(B.streak>=3?1.3:1))); S.hp+=h; SFX.heal(); floatText(pl_,'+'+h,'heal'); msg(t('b.prayer')); updBattle(); await sleep(500); }
        else if(sp.id==='hope'){ B.shield=2; SFX.heal(); floatText(pl_,t('b.shielded'),'info'); msg(t('b.hope')); updBattle(); await sleep(500); }
      } else { B.streak=0; msg(t('b.fizzle',sp.name)); updBattle(); await sleep(400); }
      await mechAnswer(ok,q,sp.id);
    }
    if(B.foes.every(f=>f.hp<=0)){ await sleep(400); return victory(); }
    const comp=COMPS[S.comp], cs=S.comps[S.comp]; const pit=B.foes.find(f=>f.boss&&f.hp>0&&f.mech.type==='pit'&&f.m.v<f.mech.n);
    if(pit&&comp){ if(B.turn===1||B.turn%3===0) msg(t('bm.jealous.pit',comp.name)); }
    else if(comp&&cs){ const ce=$('#bComp'); const tier=compTier(cs); const special=tier>0&&B.turn%3===0; const pw=Math.round(comp.p*(1+(cs.lvl-1)*.28)*(1+tier*.25)*(special?1.8:1));
      if(special){ floatText(ce,t('evo.special'),'info'); await sleep(250); }
      const tgt=()=>B.foes[B.target].hp>0?B.foes[B.target]:B.foes.find(f=>f.hp>0);
      if(comp.type==='attack'||comp.type==='all'||comp.type==='coins'){ const ts=comp.type==='all'?B.foes.filter(f=>f.hp>0):[tgt()]; const dmg=comp.type==='coins'?Math.round(pw*.8):pw;
        anim(ce,'lunge-r'); for(const f of ts){ if(f.marches!=null){ floatText(f.el,t('b.wallsStrong'),'info'); continue; } const dd=f.boss?mechDmg(f,dmg,null):dmg; f.hp=Math.max(0,f.hp-dd); floatText(f.el,'−'+dd,'dmg'); anim(f.el,'shake'); } SFX.hit(); updBattle(); await sleep(450); }
      else if(comp.type==='heal'&&(S.hp<maxHP()*.7||special)){ const h=Math.min(maxHP()-S.hp,Math.round(pw*.7)); if(h>0){ S.hp+=h; floatText(pl_,'+'+h,'heal'); updBattle(); await sleep(400); } }
      else if(comp.type==='shield'){ B.compShield=Math.min(special?95:70,comp.p+cs.lvl*2+(special?30:0)); floatText(ce,t('b.guard'),'info'); await sleep(350); }
      else if(comp.type==='stun'){ const f=tgt(); anim(ce,'lunge-r'); if(f&&f.marches==null&&(special||Math.random()*100<comp.p+cs.lvl*2)){ f.stun=1; floatText(f.el,t('b.stunned'),'info'); } else if(f){ const d=Math.round(pw*.25); f.hp=Math.max(0,f.hp-d); floatText(f.el,'−'+d,'dmg'); } updBattle(); await sleep(400); } }
    if(pit&&pit.m.v>=pit.mech.n&&!pit.m.back){ pit.m.back=1; toast(t('bm.jealous.full',comp?comp.name:'')); }
    if(B.foes.every(f=>f.hp<=0)){ await sleep(400); return victory(); }
    await mechTurn();
    for(const f of B.foes.filter(f=>f.hp>0)){
      if(f.stun){ f.stun=0; msg(t('b.skips',f.name)); updBattle(); await sleep(500); continue; }
      const it=f.intent;
      if(it==='heal'){ const hurt=B.foes.filter(o=>o.hp>0&&o.hp<o.max*.7); if(hurt.length){ const o=hurt.sort((a,b)=>a.hp/a.max-b.hp/b.max)[0]; const h=Math.round(o.max*.22); o.hp=Math.min(o.max,o.hp+h); floatText(o.el,'+'+h,'heal'); msg(t('b.mends',f.name)); updBattle(); await sleep(500); } }
      else if(it==='charge'){ msg(t('b.charging',f.name)); anim(f.el,'shake'); SFX.open(); await sleep(650); }
      else if(it==='big'){ msg(t('b.bigHit',f.name)); await foeHit(f,2.1); }
      else if(f.trait==='quick'){ await foeHit(f,.6); if(S.hp>0) await foeHit(f,.6); } else await foeHit(f,1);
      f.intent=nextIntent(f); updBattle();
      if(S.hp<=0) break; }
    if(B.shield>0){ B.shield--; updBattle(); }
    if(S.hp<=0){ await sleep(400); return defeat(); }
    const ch=B.foes.find(f=>f.hp>0&&f.intent==='big'); msg(ch?t('b.warnBig',ch.name):t('b.turn'));
  }
}
function victory(){
  const chId=B.ch, R=CH[chId], n=B.foes.length; let xp=0, coins=0;
  const tr=tierOf(chId); if(B.boss){ xp=Math.round((14+tr*7)*5); coins=Math.round((6+tr*4)*5); } else { xp=Math.round(n*(10+tr*6)); coins=Math.round(n*(5+tr*3)); }
  if(B.champ){ xp=Math.round(xp*1.5); coins=Math.round(coins*2); }
  const comp=COMPS[S.comp], cs=S.comps[S.comp]; let bonus=0;
  if(comp&&cs&&comp.type==='coins'){ bonus=comp.p+cs.lvl*2; coins+=bonus; }
  S.coins+=coins; const lv=gainXP(xp); let compLv=false, evo=false;
  if(cs){ const t0=compTier(cs); cs.xp+=Math.round(xp/2); while(cs.xp>=40+cs.lvl*30){ cs.xp-=40+cs.lvl*30; cs.lvl++; compLv=true; } evo=compTier(cs)>t0; }
  let drop=null; if(!B.boss&&Math.random()<.22){ drop=pick(['bread','bread','fish']); addItem(drop,1); }
  const c=S.chs[chId]; let note='', rare=null;
  B.foes.forEach(f=>{ const k=f.boss?'boss:'+f.boss.kind:'foe:'+chId+':'+f.name; S.book=S.book||{}; S.book[k]=(S.book[k]||0)+1; });
  if(B.champ){ S.champs=S.champs||{}; const first=!S.champs[chId]; S.champs[chId]=(S.champs[chId]||0)+1; note=t('champ.won',bn(R.boss.name)); if(first){ rare=grantRare(chId); } }
  else if(B.boss){ c.stage=3; M.ents=M.ents.filter(e=>e.kind!=='boss'); note=t('win.bossDown',bn(R.boss.name),R.guide.name); }
  else if(c.stage===1){ c.kills+=n; if(c.kills>=R.kills){ c.kills=R.kills; c.stage=2; addBoss(); note=t('win.bossUp',bn(R.boss.name),R.boss.where); } }
  if(B.ent) M.foes=M.foes.filter(f=>f!==B.ent);
  challengeEvent('win',{boss:B.boss,hurt:B.hurt,n});
  SFX.win(); save();
  const lines=[t('win.xp',xp),t('win.coins',coins)]; if(bonus) lines.push(t('win.bonus',comp.name,bonus)); if(drop) lines.push(t('win.found',ITEMS[drop].e,ITEMS[drop].name)); if(lv) lines.push(t('win.lvl',S.level)); if(compLv) lines.push(t('win.comp',comp.name,cs.lvl));
  if(evo) lines.push(t('evo.grew',comp.name,compStars(cs)));
  if(rare) lines.push(t('champ.rare',rare));
  const newSp=lv&&SPELLS.find(s=>s.lv===S.level); if(newSp) lines.push(t('win.spell',newSp.name));
  resultPanel(t('win.title'),lines,note);
  if(B.boss&&!B.champ) B.cut=1;
}
function gainXP(x){ S.xp+=x; let up=false; while(S.xp>=xpNeed()){ S.xp-=xpNeed(); S.level++; up=true; } if(up){ S.hp=maxHP(); SFX.lvl(); } return up; }
function defeat(){ S.hp=maxHP(); S.coins=Math.max(0,S.coins-Math.min(10,Math.floor(S.coins*.1))); resultPanel(t('lose.title'),[t('lose.l1'),t('lose.l2')],t('lose.note'),true); }
function resultPanel(title,lines,note,lost){
  const box=$('#bSpells'); box.innerHTML='';
  const d=document.createElement('div'); d.style.gridColumn='1/-1'; d.innerHTML=`<div style="font-family:var(--f-display);font-size:1.5rem;color:var(--gold-soft)">${esc(title)}</div>${lines.map(l=>`<div style="font-weight:800">${esc(l)}</div>`).join('')}${note?`<div style="margin-top:6px;color:var(--sky);font-weight:800">${esc(note)}</div>`:''}`;
  const b=document.createElement('button'); b.className='btn gold'; b.textContent=t('btn.continue'); b.style.gridColumn='1/-1'; b.onclick=()=>endBattle(lost?'lose':'win');
  box.appendChild(d); box.appendChild(b); $('#bMsg').textContent=''; setTimeout(()=>b.focus(),50);
}
function endBattle(how){
  const cut=B&&B.cut&&how==='win'?B.ch:null;
  if(B&&B.r3) R3.battleEnd();
  $('#battle').hidden=true; mode='world'; $('#hud').hidden=false;
  if(how==='lose') enterMap(M.id); else { P.inv=how==='flee'?2.5:1.5; P.blink=1; sceneMusic(); }
  B=null; actEnt=null; save(); updHUD();
  if(cut){ setTimeout(()=>banner(t('cut.'+cut),CH[cut].name),R3.ok&&S.view==='3d'?600:100); if(R3.ok&&S.view==='3d') R3.cutscene(cut); }
}

/* ---- daily & weekly challenges ---- */
function weekKey(){ const d=new Date(); const j=new Date(d.getFullYear(),0,1); return d.getFullYear()+'-W'+Math.ceil(((d-j)/DAY+j.getDay()+1)/7); }
function mkChallenges(seed,weekly){ const r=mulberry32(seed); const cats=CATK.filter(k=>S.mix[k]>0); const jr=isJunior();
  if(weekly) return [{k:'ans_any',n:jr?40:60},{k:'boss',n:1},{k:'verse',n:jr?4:6}].map(o=>({...o,p:0,claimed:0,reward:jr?100:120}));
  const pool=[()=>({k:'ans_cat',cat:cats[Math.floor(r()*cats.length)]||'bible',n:jr?4:5}),()=>({k:'ans_any',n:jr?10:15}),()=>({k:'win',n:3}),()=>({k:'perfect',n:1}),()=>({k:'streak',n:jr?4:5}),()=>({k:'practice',n:8}),()=>({k:'review',n:3})];
  const out=[], used=new Set(); while(out.length<3){ const i=Math.floor(r()*pool.length); if(used.has(i)) continue; used.add(i); out.push({...pool[i](),p:0,claimed:0,reward:25}); } return out; }
function challenges(){ if(!S) return null; const d=today(), w=weekKey(); S.chal=S.chal||{};
  if(S.chal.day!==d){ S.chal.day=d; S.chal.list=mkChallenges(+d.replace(/-/g,'')+S.created%997,false); S.chal.bonus=0; }
  if(S.chal.week!==w){ S.chal.week=w; S.chal.wk=mkChallenges(+(w.replace(/\D/g,''))+S.created%991,true); }
  return S.chal; }
function chText(c){ return t('chk.'+c.k,c.n,c.cat?catName(c.cat):''); }
function bump(c,v){ if(c.p>=c.n) return; c.p=Math.min(c.n,v===undefined?c.p+1:v); if(c.p>=c.n){ toast(t('ch.done',chText(c))); SFX.coin(); markQuestBadge(); } }
function challengeEvent(type,d){ const C=challenges(); if(!C) return; const all=[...C.list,...C.wk];
  if(type==='answer'){ S.cstreak=d.ok?(S.cstreak||0)+1:0; }
  for(const c of all){
    if(type==='answer'&&d.ok){ if(c.k==='ans_any') bump(c); if(c.k==='ans_cat'&&c.cat===d.cat) bump(c); if(c.k==='review'&&curQ&&curQ.review) bump(c); if(c.k==='practice'&&practicing) bump(c); }
    if(type==='answer'&&c.k==='streak') bump(c,Math.max(c.p,S.cstreak||0));
    if(type==='win'){ if(c.k==='win') bump(c); if(c.k==='perfect'&&d.hurt===0) bump(c); if(c.k==='boss'&&d.boss) bump(c); }
    if(type==='verse'&&c.k==='verse') bump(c); } }
function claimable(){ const C=challenges(); return C?[...C.list,...C.wk].some(c=>c.p>=c.n&&!c.claimed):false; }
function markQuestBadge(){ const b=$('#bQuest'); if(b) b.classList.toggle('badge',claimable()); }
function challengeHTML(){ const C=challenges(); const row=(c,i,wk)=>`<div class="chrow ${c.claimed?'done':''}"><div class="grow"><b>${esc(chText(c))}</b><div class="bar xp" style="display:block"><i style="width:${Math.round(c.p/c.n*100)}%"></i></div><small>${c.p} / ${c.n} · ${esc(t('ch.reward',c.reward))}</small></div>${c.claimed?`<span class="tag ok">${esc(t('ch.claimed'))}</span>`:`<button class="btn sm gold" data-claim="${wk?'w':'d'}${i}" ${c.p<c.n?'disabled':''}>${esc(t('ch.claim'))}</button>`}</div>`;
  return `<div class="sect">${esc(t('ch.daily'))}</div>${C.list.map((c,i)=>row(c,i,0)).join('')}<div class="sect">${esc(t('ch.weekly'))}</div>${C.wk.map((c,i)=>row(c,i,1)).join('')}`; }

async function downloadBackup(){ const fname=`scrolls-of-light-${(S.name||'pilgrim').replace(/[^\w-]+/g,'_')}-${new Date().toISOString().slice(0,10)}.json`;
  let dl=null; try{ if(window.claude&&typeof window.claude.use==='function') dl=await window.claude.use('downloads'); }catch(e){ dl=null; }
  if(dl){ try{ S.lastBackup=Date.now(); save(); await dl.save({filename:fname,data:JSON.stringify(S,null,1)}); toast(t('toast.saved')); }catch(e){ if(!e||e.code!=='declined') toast(t('toast.copyManual')); } return; }
  try{ S.lastBackup=Date.now(); save(); const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=`scrolls-of-light-${(S.name||'pilgrim').replace(/[^\w-]+/g,'_')}-${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); toast(t('toast.saved')); }catch(e){ toast(t('toast.copyManual')); } }
function importSave(o,msgEl){ try{ if(typeof o==='string'){ o=o.trim(); o=o.startsWith('{')?JSON.parse(o):JSON.parse(decodeURIComponent(escape(atob(o)))); } if(!o||o.v!==1||!o.chs) throw 0;

  S=o; lsSet(SKEY(S.id),JSON.stringify(S)); applyLang(S.lang||LANG); save(); if(modalOpen) closeModal(); startProfile(); toast(t('toast.loaded')); return true; }catch(e){ if(msgEl) msgEl.textContent=t('set.loadBad'); else toast(t('set.loadBad')); return false; } }

function Bucket(){ this.map=new Map(); }
Bucket.prototype.add=function(key,geoF,matF,it){ if(this.tk!=null) it.tk=this.tk; let b=this.map.get(key); if(!b){ b={geo:geoF(),mat:matF(),list:[],cast:true}; this.map.set(key,b); } b.list.push(it); return b; };
Bucket.prototype.build=function(parent,noCast){ const m4=new TH.Matrix4(), q=new TH.Quaternion(), p=new TH.Vector3(), s=new TH.Vector3(), e=new TH.Euler(0,0,0,'YXZ');
  this.map.forEach((b,key)=>{ if(!b.list.length) return; const im=new TH.InstancedMesh(b.geo,b.mat,b.list.length);
    b.list.forEach((it,i)=>{ p.set(it.x,it.y||0,it.z); e.set(it.rx||0,it.ry||0,it.rz||0,'YXZ'); q.setFromEuler(e); const sc=it.s||1; s.set(it.sx||sc,it.sy||sc,it.sz||sc); m4.compose(p,q,s); im.setMatrixAt(i,m4); if(it.c) im.setColorAt(i,c3(it.c)); if(it.tk!=null&&this.byTile){ let L=this.byTile.get(it.tk); if(!L) this.byTile.set(it.tk,L=[]); L.push({im,i,m:m4.clone(),cx:it.cx,cz:it.cz}); } });
    if(im.instanceColor) im.instanceColor.needsUpdate=true; im.castShadow=!noCast&&b.cast!==false&&!b.noCast; im.receiveShadow=true; parent.add(im); }); };

const MODEL_BASE='models/', MODEL_FMT='glb';
const GLB={}, GLBMAP={cow:'Cow',ox:'Bull',deer:'Deer',horse:'Horse',fox:'Fox',frog:'Frog'};
const GLBH={Cow:1.05,Bull:1.12,Deer:1.15,Horse:1.4,Fox:.56,Frog:.4,Donkey:1.08,Snake:.5,Boat:.9};
function loadGLB(name){ if(GLB[name]) return GLB[name].p; const e={}; GLB[name]=e;
  e.p=new Promise(res=>{ if(!TH.GLTFLoader){ e.fail=1; res(null); return; } const ok=g=>{ e.g=g; res(g); }, bad=()=>{ e.fail=1; res(null); };
    try{ if(MODEL_FMT==='b64') fetch(MODEL_BASE+name+'.json').then(r=>r.json()).then(j=>{ const bin=Uint8Array.from(atob(j.d),c=>c.charCodeAt(0)); new TH.GLTFLoader().parse(bin.buffer,'',ok,bad); }).catch(bad);
      else new TH.GLTFLoader().load(MODEL_BASE+name+'.glb',ok,undefined,bad); }catch(err){ bad(); } }); return e.p; }
const glbReady=n=>!!(GLB[n]&&GLB[n].g);
function glbActor(name){ const e=GLB[name]; if(!e||!e.g) return null; const g=e.g; const root=new TH.Group();
  const o=TH.SkeletonUtils?TH.SkeletonUtils.clone(g.scene):g.scene.clone(true); o.updateMatrixWorld(true);
  const bb=new TH.Box3().setFromObject(o); const h=Math.max(.01,bb.max.y-bb.min.y); const s=(GLBH[name]||1)/h; o.scale.multiplyScalar(s); o.position.y=-bb.min.y*s; root.add(o);
  o.traverse(x=>{ if(x.isMesh){ x.castShadow=true; x.receiveShadow=true; x.frustumCulled=false; } });
  const mixer=g.animations.length?new TH.AnimationMixer(o):null; const clip=re=>g.animations.find(a=>re.test(a.name.split('|').pop()));
  const acts={}; if(mixer){ const m={idle:/^(Frog_|Snake_)?Idle$/,walk:/^(Snake_)?Walk$|^Frog_Jump$/,run:/^Gallop$|^Frog_Jump$|^Snake_Walk$/,eat:/^Eating$/}; for(const k in m){ const c=clip(m[k]); if(c) acts[k]=mixer.clipAction(c); } }
  let cur=null; const play=k=>{ const a=acts[k]||acts.idle; if(!a||a===cur) return; a.reset().play(); if(cur) cur.crossFadeTo(a,.25,false); cur=a; };
  play('idle'); const a={root,kind:'walk',height:GLBH[name]||1,glb:name,mixer};
  a.update=(dt,speed,t)=>{ if(a.eat&&speed<.2) play('eat'); else play(speed>3.2?'run':speed>.25?'walk':'idle'); if(mixer) mixer.update(dt*(speed>.25&&speed<3.2?Math.min(1.6,.6+speed*.3):1)); };
  return a; }
function petModel3(id){ const n=GLBMAP[id]; if(n){ if(glbReady(n)){ const a=glbActor(n); if(a) return a; } else loadGLB(n); } return buildPet(id); }

function houseSave(){ const hd=houseData(); hd.items=HS.items.map(i=>({id:i.id,x:i.x,z:i.z,rot:i.rot})); save(); }

function canPlace(id,x,z,rot,ignore){ const [w,d]=hdims(id,rot); if(x<0||z<0||x+w>HN||z+d>HN) return false; const Lr=FURN[id].floor?HS.rugs:HS.grid; for(let i=x;i<x+w;i++) for(let j=z;j<z+d;j++){ const o=Lr[j*HN+i]; if(o&&o!==ignore) return false; } return true; }

function tools(){ const tb=$('#htools'); if(!tb||!HS) return;

function lazyThumbs(root){ const imgs=[...root.querySelectorAll('img[data-th]')].filter(i=>!i.getAttribute('src')); let i=0;
  const step=()=>{ const t0=performance.now(); while(i<imgs.length&&performance.now()-t0<14){ const im=imgs[i++]; if(!im.isConnected) continue; const [k,a,b]=im.dataset.th.split(':'); try{ im.src=k==='f'?thumbFurn(a):k==='p'?thumbPet(a):thumbProp(a,b); }catch(e){ console.error(e); } } if(i<imgs.length) requestAnimationFrame(step); };

function reachCheck(id){ const m=buildMap(id); const W=m.W; const seen=bfsAll(m,m.spawn.x,m.spawn.y); const ok=(x,y)=>seen.has(y*W+x); const bad=[];

  if(m.bossPos){ const b=m.bossPos; if(![[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>ok(b.x+dx,b.y+dy))) bad.push('boss'); }
